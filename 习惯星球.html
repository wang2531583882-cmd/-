<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f9f5e9">
<meta name="description" content="习惯星球文明：用打卡养成你的等距星球文明">
<title>习惯星球文明 · 浮岛纪事</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#060a18;--panel:#0b1228;--line:rgba(90,160,240,.16);
  --text:#dbeafe;--muted:#7f93b8;--accent:#5eead4;--accent2:#7dd3fc;
  --safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;overflow:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  background:radial-gradient(circle at 50% -10%,#14214a 0%,#060a18 55%);
  color:var(--text);overscroll-behavior:none;
}
#app{height:100%;display:grid;grid-template-rows:auto 1fr;padding-top:var(--safe-top);min-width:0;overflow:hidden}
#app > *{min-width:0}
header{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:12px 20px;border-bottom:1px solid var(--line);
  background:rgba(6,10,24,.6);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:5;
  min-width:0;
}
.brand{display:flex;align-items:center;gap:11px;flex-shrink:0;min-width:0}
.brand .logo{font-size:25px;filter:drop-shadow(0 0 10px rgba(94,234,212,.6))}
.brand h1{font-size:16px;letter-spacing:.5px;font-weight:700;white-space:nowrap}
.brand p{font-size:10.5px;color:var(--muted);margin-top:2px;white-space:nowrap}
.header-right{display:flex;align-items:center;gap:12px;min-width:0;flex-wrap:wrap;justify-content:flex-end}
.header-stats{display:flex;gap:16px;font-size:11.5px;color:var(--muted);flex-wrap:wrap;justify-content:flex-end;min-width:0}
.header-stats b{color:var(--accent);font-size:14px;margin-left:3px}
.header-stats .civ b{color:#a7f3d0}
.theme-toggle{
  width:38px;height:38px;border-radius:50%;
  border:1px solid rgba(115,138,130,.2);
  background:rgba(255,255,255,.6);
  color:#6e8d84;cursor:pointer;font-size:17px;
  display:grid;place-items:center;flex-shrink:0;
  transition:all .18s;font-family:inherit;line-height:1;
}
.theme-toggle:hover{background:#eef3ec;color:#4a8277}

main.stage-area{position:relative;overflow:hidden;min-height:0;min-width:0}
canvas#planet{
  display:block;width:100%;height:100%;
  touch-action:none;cursor:grab;
}
canvas#planet.dragging{cursor:grabbing}

.tip{
  position:absolute;top:12px;left:50%;transform:translateX(-50%);
  font-size:10.5px;color:var(--muted);background:rgba(10,16,34,.72);
  padding:5px 12px;border-radius:20px;border:1px solid var(--line);
  pointer-events:none;white-space:nowrap;z-index:41;max-width:86%;
  overflow:hidden;text-overflow:ellipsis;backdrop-filter:blur(8px);
}

.fab-bar{
  position:absolute;bottom:max(14px,calc(14px + var(--safe-bottom)));left:50%;transform:translateX(-50%);
  display:flex;gap:6px;padding:6px;background:rgba(8,14,30,.8);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--line);border-radius:16px;z-index:45;
  box-shadow:0 10px 30px rgba(0,0,0,.4);
}
.fab{
  border:1px solid transparent;background:transparent;color:var(--muted);
  padding:9px 12px;border-radius:11px;font-size:12px;font-family:inherit;cursor:pointer;
  display:inline-flex;align-items:center;gap:5px;white-space:nowrap;transition:all .15s;
  touch-action:manipulation;
}
.fab:hover{background:rgba(255,255,255,.06);color:var(--text)}
.fab.active{color:var(--accent);background:rgba(94,234,212,.14);border-color:rgba(94,234,212,.4)}

.panel-mask{
  position:fixed;inset:0;background:rgba(3,6,16,.42);
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
  z-index:55;display:none;
}
.panel-mask.show{display:block}
.panel{
  position:absolute;right:0;top:0;bottom:0;width:400px;max-width:100%;
  background:var(--panel);border-left:1px solid var(--line);
  box-shadow:-20px 0 60px rgba(0,0,0,.45);
  overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  padding:18px;display:flex;flex-direction:column;gap:13px;
  padding-bottom:calc(18px + var(--safe-bottom));
  animation:slideRight .22s cubic-bezier(.2,.9,.3,1);
}
.panel > *{min-width:0}
@keyframes slideRight{from{transform:translateX(100%)}to{transform:none}}

.panel::-webkit-scrollbar{width:6px}
.panel::-webkit-scrollbar-thumb{background:rgba(90,160,240,.25);border-radius:3px}

.panel-head{
  display:flex;align-items:flex-start;justify-content:space-between;gap:10px;
  position:sticky;top:0;z-index:3;
  margin:-18px -18px 0;
  padding:18px 18px 11px;
  background:linear-gradient(180deg,var(--panel) 72%,rgba(11,18,40,.94));
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  border-bottom:1px solid rgba(90,160,240,.08);
}
.panel-title{font-size:13px;font-weight:700;letter-spacing:1px;color:var(--accent2)}
.panel-sub{font-size:11px;color:var(--muted);margin-top:4px}
.panel-close{
  width:32px;height:32px;border-radius:9px;border:1px solid var(--line);
  background:rgba(255,255,255,.03);color:var(--muted);font-size:16px;
  cursor:pointer;display:grid;place-items:center;flex-shrink:0;touch-action:manipulation;
}
.panel-close:hover{background:rgba(248,113,113,.12);color:#fca5a5;border-color:rgba(248,113,113,.3)}

.btn{
  border:1px solid var(--line);background:rgba(94,234,212,.08);color:var(--accent);
  padding:8px 14px;border-radius:9px;font-size:12px;cursor:pointer;transition:all .16s;
  font-family:inherit;white-space:nowrap;touch-action:manipulation;
}
.btn:hover{background:rgba(94,234,212,.18);border-color:rgba(94,234,212,.45)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:disabled:hover{background:rgba(94,234,212,.08);border-color:var(--line)}
.btn.primary{background:linear-gradient(135deg,#2dd4bf,#38bdf8);color:#04202a;font-weight:700;border:none;padding:12px 16px;font-size:14px;width:100%}
.btn.primary:hover{filter:brightness(1.1)}
.btn.ghost{background:transparent;color:var(--muted)}
.btn.danger{color:#fca5a5;border-color:rgba(248,113,113,.3);background:rgba(248,113,113,.06)}
.btn.danger:hover{background:rgba(248,113,113,.15)}
.btn.warn{color:#fbbf24;border-color:rgba(251,191,36,.3);background:rgba(251,191,36,.06)}
.btn.warn:hover{background:rgba(251,191,36,.15)}

.habit-list{display:flex;flex-direction:column;gap:8px}
.habit-item{
  display:flex;align-items:center;gap:11px;padding:10px 11px;border-radius:12px;
  background:rgba(255,255,255,.03);border:1px solid var(--line);cursor:pointer;transition:all .18s;
}
.habit-item:hover{background:rgba(94,234,212,.07);border-color:rgba(94,234,212,.35)}
.habit-item .ico{font-size:21px;width:32px;text-align:center;flex-shrink:0}
.habit-item .info{flex:1;min-width:0}
.habit-item .name{font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.habit-item .meta{font-size:10.5px;color:var(--muted);margin-top:3px}
.mini-bar{height:3px;border-radius:2px;background:rgba(255,255,255,.08);margin-top:6px;overflow:hidden}
.mini-bar i{display:block;height:100%;border-radius:2px;transition:width .4s}
.badge{font-size:10px;padding:3px 8px;border-radius:20px;border:1px solid currentColor;opacity:.85;white-space:nowrap;flex-shrink:0}

.empty{text-align:center;color:var(--muted);font-size:12px;padding:32px 10px;line-height:2}
.empty .big{font-size:32px;display:block;margin-bottom:8px;opacity:.6}

.detail-head{display:flex;align-items:center;gap:13px}
.detail-head .big-ico{
  font-size:28px;width:54px;height:54px;display:grid;place-items:center;border-radius:16px;
  background:rgba(255,255,255,.05);border:1px solid var(--line);flex-shrink:0;
}
.detail-head h2{font-size:16px;line-height:1.35;word-break:break-word;overflow-wrap:anywhere}
.detail-head .tag{font-size:10.5px;color:var(--muted);margin-top:5px}

.big-count{text-align:center;padding:12px 0 4px}
.big-count .n{
  font-size:44px;font-weight:800;line-height:1;
  background:linear-gradient(180deg,#a7f3d0,#38bdf8);-webkit-background-clip:text;background-clip:text;color:transparent;
}
.big-count .lbl{font-size:10.5px;color:var(--muted);margin-top:6px;letter-spacing:2px}

.progress-wrap{margin-top:4px}
.progress-bar{height:9px;border-radius:5px;background:rgba(255,255,255,.07);overflow:hidden;border:1px solid rgba(255,255,255,.05)}
.progress-bar i{
  display:block;height:100%;border-radius:5px;
  background:linear-gradient(90deg,#2dd4bf,#7dd3fc);transition:width .5s cubic-bezier(.2,.9,.3,1);
  box-shadow:0 0 12px rgba(94,234,212,.6);
}
.progress-meta{display:flex;justify-content:space-between;gap:8px;font-size:10.5px;color:var(--muted);margin-top:7px}
.progress-meta span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.section-title{font-size:11px;letter-spacing:1.5px;color:var(--muted);margin:6px 0 2px;text-transform:uppercase}

.timeline{display:flex;flex-direction:column;gap:0}
.tl-item{display:flex;gap:10px;padding-bottom:13px;position:relative}
.tl-item:not(:last-child)::before{
  content:'';position:absolute;left:7px;top:18px;bottom:0;width:1px;
  background:linear-gradient(180deg,rgba(94,234,212,.4),rgba(94,234,212,.05));
}
.tl-dot{
  width:15px;height:15px;border-radius:50%;flex-shrink:0;margin-top:2px;
  border:2px solid rgba(94,234,212,.5);background:rgba(94,234,212,.15);
  display:grid;place-items:center;font-size:8px;color:#04202a;font-weight:900;
}
.tl-dot.done{background:var(--accent);border-color:var(--accent);box-shadow:0 0 10px rgba(94,234,212,.6)}
.tl-body .t{font-size:12px;font-weight:600}
.tl-body .d{font-size:10.5px;color:var(--muted);margin-top:3px}

.civ-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding-top:13px;border-top:1px solid var(--line);margin-top:4px}
.civ-stats>div{
  text-align:center;font-size:10px;color:var(--muted);background:rgba(255,255,255,.025);
  padding:9px 4px;border-radius:10px;border:1px solid var(--line);
}
.civ-stats b{display:block;font-size:16px;color:var(--accent2);margin-bottom:3px}

.codex-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.codex-tab{
  padding:8px 3px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.03);
  color:var(--muted);font-size:11px;cursor:pointer;font-family:inherit;transition:all .16s;
  display:flex;align-items:center;justify-content:center;gap:4px;
  min-width:0;overflow:hidden;
}
.codex-tab:hover{background:rgba(255,255,255,.07)}
.codex-tab.active{color:var(--accent);border-color:rgba(94,234,212,.45);background:rgba(94,234,212,.12);font-weight:700}
.codex-list{display:flex;flex-direction:column;gap:8px}
.codex-row{
  display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:13px;
  background:rgba(255,255,255,.03);border:1px solid var(--line);transition:all .16s;
}
.codex-row:hover{border-color:rgba(94,234,212,.3);background:rgba(94,234,212,.05)}
.codex-canvas{flex-shrink:0;display:block}
.codex-info{flex:1;min-width:0}
.codex-info .t{font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.codex-info .d{font-size:10.5px;color:var(--muted);margin-top:4px;line-height:1.55}
.mini-tag{font-size:9px;padding:1px 6px;border-radius:20px;border:1px solid currentColor;font-weight:500}
.mini-tag.on{color:var(--accent)}
.mini-tag.off{color:#4b5b7d}

.civ-hero{
  text-align:center;padding:16px 14px;border-radius:16px;
  background:linear-gradient(160deg,rgba(45,212,191,.13),rgba(56,189,248,.05));
  border:1px solid rgba(94,234,212,.22);
}
.civ-hero .n{
  font-size:42px;font-weight:800;line-height:1;
  background:linear-gradient(180deg,#a7f3d0,#38bdf8);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 20px rgba(94,234,212,.35));
}
.civ-hero .tier{margin-top:9px;font-size:15px;font-weight:700;color:var(--accent)}
.civ-hero .sub{margin-top:4px;font-size:10.5px;color:var(--muted)}
.civ-hero .progress-bar{margin-top:13px;text-align:left}
.civ-hero .progress-meta{margin-top:7px}

.civ-row{
  display:flex;justify-content:space-between;align-items:center;font-size:11.5px;
  padding:8px 11px;border-radius:9px;background:rgba(255,255,255,.03);border:1px solid var(--line);gap:10px;
  min-width:0;
}
.civ-row .k{color:var(--muted);min-width:0}
.civ-row .v{color:var(--accent);font-weight:700;white-space:normal;text-align:right;word-break:break-word;min-width:0}

.stage-row{display:flex;align-items:center;gap:9px;font-size:11.5px}
.stage-row .name{width:60px;color:var(--muted);flex-shrink:0}
.stage-row .bar{flex:1;height:7px;border-radius:4px;background:rgba(255,255,255,.06);overflow:hidden}
.stage-row .bar i{display:block;height:100%;border-radius:4px;transition:width .5s}
.stage-row .num{width:22px;text-align:right;color:var(--accent2);font-weight:700}

.cat-row{display:flex;align-items:center;gap:9px;font-size:11.5px}
.cat-row .ico{width:20px;text-align:center;font-size:14px}
.cat-row .name{width:40px;color:var(--muted);flex-shrink:0}
.cat-row .bar{flex:1;height:7px;border-radius:4px;background:rgba(255,255,255,.06);overflow:hidden}
.cat-row .bar i{display:block;height:100%;border-radius:4px}
.cat-row .num{width:38px;text-align:right;color:var(--accent2);font-weight:700}

.civ-codex{display:flex;flex-direction:column;gap:7px}
.civ-card{
  display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:12px;
  border:1px solid var(--line);background:rgba(255,255,255,.025);position:relative;overflow:hidden;transition:all .2s;
}
.civ-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:transparent;transition:background .2s}
.civ-card.reached{background:rgba(94,234,212,.05);border-color:rgba(94,234,212,.22)}
.civ-card.reached::before{background:rgba(94,234,212,.5)}
.civ-card.current{
  background:linear-gradient(90deg,rgba(45,212,191,.18),rgba(56,189,248,.06));
  border-color:rgba(94,234,212,.55);box-shadow:0 0 22px rgba(94,234,212,.15);
}
.civ-card.current::before{background:var(--accent);box-shadow:0 0 12px rgba(94,234,212,.8)}
.cc-icon{
  font-size:22px;width:40px;height:40px;display:grid;place-items:center;border-radius:11px;
  background:rgba(0,0,0,.22);flex-shrink:0;filter:grayscale(1) opacity(.35);transition:filter .2s;
}
.civ-card.reached .cc-icon{filter:none}
.cc-info{flex:1;min-width:0}
.cc-name{font-size:12.5px;font-weight:700;color:#4b5b7d}
.civ-card.reached .cc-name{color:var(--text)}
.civ-card.current .cc-name{color:var(--accent)}
.cc-req{font-size:10px;color:var(--muted);margin-top:2px}
.cc-state{font-size:9.5px;padding:1px 7px;border-radius:20px;border:1px solid currentColor;color:#4b5b7d;white-space:nowrap}
.civ-card.reached .cc-state{color:var(--accent)}
.civ-card.current .cc-state{color:#04202a;background:var(--accent);border-color:var(--accent);font-weight:700}

.expand-card{
  padding:13px;border-radius:13px;
  background:linear-gradient(160deg,rgba(56,189,248,.09),rgba(94,234,212,.03));
  border:1px solid rgba(94,234,212,.2);display:flex;flex-direction:column;gap:8px;
}
.expand-line{display:flex;justify-content:space-between;font-size:11.5px;min-width:0;gap:8px}
.expand-line .k{color:var(--muted);min-width:0}
.expand-line .v{color:var(--text);font-weight:600;white-space:normal;text-align:right;word-break:break-word;min-width:0}
.expand-line .v.ok{color:var(--accent)}
.expand-bar{height:7px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:2px}
.expand-bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#38bdf8,#2dd4bf);transition:width .5s}
.expand-hint{font-size:10px;color:var(--muted);line-height:1.6}

.action-row{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.action-row .btn{width:100%;padding:11px;text-align:center}

.modal-mask{
  position:fixed;inset:0;background:rgba(3,6,16,.78);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  display:grid;place-items:center;z-index:60;padding:20px;animation:fadeIn .18s;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{
  background:var(--panel);border:1px solid rgba(90,160,240,.28);border-radius:18px;padding:22px;
  width:100%;max-width:400px;max-height:86vh;overflow-y:auto;
  box-shadow:0 24px 70px rgba(0,0,0,.6);animation:pop .22s cubic-bezier(.2,1.2,.4,1);
}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
.modal h3{font-size:16px;margin-bottom:4px}
.modal .hint{font-size:11.5px;color:var(--muted);margin-bottom:16px;line-height:1.65}
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:7px;letter-spacing:1px}
.field input{
  width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--line);
  background:rgba(255,255,255,.04);color:var(--text);font-size:13px;font-family:inherit;outline:none;transition:border-color .16s;
}
.field input:focus{border-color:rgba(94,234,212,.5)}
.cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cat-btn{
  padding:10px 4px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.03);
  color:var(--text);cursor:pointer;font-family:inherit;font-size:11px;
  display:flex;flex-direction:column;align-items:center;gap:4px;transition:all .16s;
}
.cat-btn span{font-size:18px}
.cat-btn:hover{background:rgba(255,255,255,.07)}
.cat-btn.active{border-color:var(--accent);background:rgba(94,234,212,.12)}
.modal-actions{display:flex;gap:10px;margin-top:18px}
.modal-actions .btn{flex:1;padding:11px;text-align:center}

.destroyed-item{
  display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:10px;
  background:rgba(248,113,113,.06);border:1px solid rgba(248,113,113,.22);font-size:12px;
}
.destroyed-item .ico{font-size:18px;width:26px;text-align:center;flex-shrink:0}
.destroyed-item .sub{font-size:10.5px;color:var(--muted);margin-top:2px}

.yb-item{display:flex;gap:12px;padding:10px 0;border-bottom:1px dashed rgba(90,160,240,.12)}
.yb-item:last-child{border-bottom:none}
.yb-icon{font-size:17px;width:24px;text-align:center;opacity:.9;flex-shrink:0}
.yb-body .t{font-size:12px;line-height:1.5}
.yb-body .d{font-size:10.5px;color:var(--muted);margin-top:3px}

@media (max-width:700px){
  .panel{
    left:0;right:0;top:auto;bottom:0;width:auto;max-width:none;
    height:82vh;border-left:none;border-top:1px solid var(--line);
    border-radius:18px 18px 0 0;box-shadow:0 -20px 60px rgba(0,0,0,.55);
    animation:slideUp .22s cubic-bezier(.2,.9,.3,1);
  }
  @keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
}
@media (max-width:560px){
  header{padding:10px 14px;gap:8px}
  .brand h1{font-size:14px}
  .brand .logo{font-size:22px}
  .brand p{display:none}
  .header-stats .civ{display:none}
  .header-stats{gap:9px;font-size:10.5px}
  .header-stats b{font-size:12.5px}
  .header-right{gap:8px}
  .theme-toggle{width:34px;height:34px;font-size:15px}
  .fab{padding:8px 9px;font-size:10.5px;gap:3px}
  .fab-bar{gap:3px;padding:4px}

<script>
/* ============================================================

const memoryStore = {};
let storageOK = (function () {
  try {
    const k = '__habit_planet_probe__';
    localStorage.setItem(k, '1');
    localStorage.removeItem(k);
    return true;
  } catch (e) { return false; }
})();
function storageSet(key, val) {
  if (storageOK) {
    try { localStorage.setItem(key, val); return; }
    catch (e) { storageOK = false; }
  }
  memoryStore[key] = val;
}
function storageGet(key) {
  if (storageOK) {
    try { return localStorage.getItem(key); }
    catch (e) { storageOK = false; }
  }
  return (key in memoryStore) ? memoryStore[key] : null;
}

}
function initTheme() {
  let saved = null;
  try { saved = localStorage.getItem(THEME_KEY); } catch (e) {}
  const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  applyTheme(saved || (prefersDark ? 'dark' : 'light'));
}

/* ============================================================

let GRID = GRID_LEVELS[0];

/* ============================================================
   日期
   ============================================================ */
function startOfDay(d) {
  const x = new Date(d);
  x.setHours(0, 0, 0, 0);
  return x;
}
function dayKey(d) {
  const x = d || new Date();
  return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, '0')}-${String(x.getDate()).padStart(2, '0')}`;
}
function parseDayKey(s) {
  if (!s) return null;
  const parts = String(s).split('-').map(Number);
  if (parts.length !== 3 || parts.some(n => isNaN(n))) return null;
  return new Date(parts[0], parts[1] - 1, parts[2]);
}

/* ============================================================
   工具
   ============================================================ */
function getStage(count) {
  if (count >= 100) return 4;
  if (count >= 49) return 3;
  if (count >= 21) return 2;
  if (count >= 7) return 1;
  return 0;
}
function progressInfo(count) {
  const stage = getStage(count);
  if (stage >= 4) return { pct: 100, from: 100, to: 100, next: null, stage };
  const from = stage === 0 ? 0 : THRESHOLDS[stage - 1];
  const to = THRESHOLDS[stage];
  return { pct: Math.max(0, (count - from) / (to - from) * 100), from, to, next: to, stage };
}
function isoToScreen(gx, gy) {
  return { x: ORIGIN_X + (gx - gy) * TW / 2, y: ORIGIN_Y + (gx + gy) * TH / 2 };
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  })[c]);
}
function fmtDate(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return '';
  return `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}`;
}
function todayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
}
function clampZoom(z) { return Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, z)); }

/* ============================================================
   状态
   ============================================================ */
const state = {
  habits: [],
  panel: null,
  selectedId: null,
  newCategory: 'sport',
  codexCategory: 'sport',
};

const floaters = [];
const pulses = [];
let hoverCell = null;

/* ============================================================
   持久化
   ============================================================ */
function save() {
  try {
    storageSet(STORAGE_KEY, JSON.stringify({ habits: state.habits, gridLevel }));
  } catch (e) {}
}
function load() {
  try {
    const raw = storageGet(STORAGE_KEY);
    if (!raw) return false;
    const data = JSON.parse(raw);
    if (typeof data.gridLevel === 'number' && data.gridLevel >= 0 && data.gridLevel < GRID_LEVELS.length) {
      gridLevel = data.gridLevel;
      GRID = GRID_LEVELS[gridLevel];
    }
    if (Array.isArray(data.habits)) {
      state.habits = data.habits.map(normalizeHabit);
      return state.habits.length > 0;
    }
  } catch (e) {}
  return false;
}
function normalizeHabit(h) {
  return {
    id: h.id || ('h' + Math.random().toString(36).slice(2, 9)),
    name: h.name || '未命名习惯',
    category: CATEGORIES[h.category] ? h.category : 'sport',
    count: Number(h.count) || 0,
    gx: Number.isInteger(h.gx) ? h.gx : 0,
    gy: Number.isInteger(h.gy) ? h.gy : 0,
    createdAt: h.createdAt || new Date().toISOString(),
    lastSettledDate: h.lastSettledDate || dayKey(startOfDay(new Date())),
    milestones: Array.isArray(h.milestones) ? h.milestones : [],
    log: Array.isArray(h.log) ? h.log : [],
  };
}

/* ============================================================
   中断结算
   ============================================================ */
function settleDecay() {
  const today = startOfDay(new Date());
  const yesterday = new Date(today);
  yesterday.setDate(yesterday.getDate() - 1);
  const destroyed = [];

  state.habits.forEach(h => {
    const fromStr = h.lastSettledDate || dayKey(startOfDay(new Date(h.createdAt)));
    const from = parseDayKey(fromStr);
    if (!from) { h.lastSettledDate = dayKey(today); return; }

    let missed = 0;
    const cursor = new Date(from);
    cursor.setDate(cursor.getDate() + 1);
    while (cursor <= yesterday) {
      const dayStart = startOfDay(cursor);
      const dayEnd = new Date(dayStart);
      dayEnd.setDate(dayEnd.getDate() + 1);
      const hasCheckIn = (h.log || []).some(ts => {
        const t = new Date(ts);
        return t >= dayStart && t < dayEnd;
      });
      if (!hasCheckIn) missed++;
      cursor.setDate(cursor.getDate() + 1);
    }

    if (missed > 0) h.count = Math.max(0, h.count - missed * DECAY_PENALTY);
    if (yesterday >= from) h.lastSettledDate = dayKey(yesterday);
    if (h.count === 0) destroyed.push(h);
  });

  if (destroyed.length > 0) {
    state.habits = state.habits.filter(h => !destroyed.includes(h));
    save();
    showDestroyedModal(destroyed);
  } else {
    save();
  }
}

function showDestroyedModal(list) {
  const mask = document.createElement('div');
  mask.className = 'modal-mask';
  const items = list.map(h => {
    const cat = CATEGORIES[h.category];
    return `
      <div class="destroyed-item">
        <div class="ico">${cat.icon}</div>
        <div>
          <div>${escapeHtml(h.name)}</div>
          <div class="sub">${cat.name}系 · 打卡次数已归零</div>
        </div>
      </div>`;
  }).join('');
  mask.innerHTML = `
    <div class="modal">
      <h3>💔 习惯中断，建筑已销毁</h3>
      <div class="hint">以下习惯因中断被扣除打卡次数至 0，已从星球上移除。每中断一天扣除 ${DECAY_PENALTY} 次打卡数。</div>
      <div style="display:flex;flex-direction:column;gap:8px">${items}</div>
      <div class="modal-actions"><button class="btn primary" data-close>知道了</button></div>
    </div>
  `;
  document.body.appendChild(mask);
  mask.addEventListener('click', (e) => {
    if (e.target === mask || e.target.closest('[data-close]')) mask.remove();
  });
}

/* ============================================================
   地块
   ============================================================ */
function isOccupied(gx, gy) {
  return state.habits.some(h => h.gx === gx && h.gy === gy);
}
function findFreePos() {
  const used = new Set(state.habits.map(h => `${h.gx},${h.gy}`));
  const center = (GRID - 1) / 2;
  const cells = [];
  for (let x = 0; x < GRID; x++) {
    for (let y = 0; y < GRID; y++) {
      cells.push({ x, y, d: Math.abs(x - center) + Math.abs(y - center) + Math.random() * 0.5 });
    }
  }
  cells.sort((a, b) => a.d - b.d);
  for (const c of cells) {
    if (!used.has(`${c.x},${c.y}`)) return { gx: c.x, gy: c.y };
  }
  return null;
}
function canExpand() {
  if (gridLevel >= GRID_LEVELS.length - 1) return false;
  const total = GRID * GRID;
  return state.habits.length >= Math.ceil(total * 0.7);
}
function expandPlanet() {
  if (!canExpand()) return;
  const oldN = GRID;
  gridLevel++;
  GRID = GRID_LEVELS[gridLevel];
  const diff = (GRID - oldN) / 2;
  state.habits.forEach(h => { h.gx += diff; h.gy += diff; });
  recalcView();
  save();
  updateHeader();
  renderPanel();
  pulses.push({ x: VW / 2, y: VH / 2, t0: performance.now(), dur: 2000, hue: 180 });
}

/* ============================================================
   Canvas 初始化
   ============================================================ */
const canvas = document.getElementById('planet');
const stageArea = document.getElementById('stageArea');
let ctx = canvas.getContext('2d');

function initCanvas() {
  const dpr = Math.min(window.devicePixelRatio || 1, window.innerWidth < 700 ? 1.8 : 2);
  VW = Math.max(1, canvas.clientWidth);
  VH = Math.max(1, canvas.clientHeight);
  canvas.width = Math.round(VW * dpr);
  canvas.height = Math.round(VH * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  recalcView();
}

function recalcView() {
  const N = GRID;
  const gridW = N * TW;
  const gridH = N * TH;
  const s = Math.min(2.8, VW * 0.82 / gridW, VH * 0.74 / gridH);
  viewScale = Math.max(0.3, s);
  ORIGIN_X = VW / 2;
  ORIGIN_Y = VH / 2 - (N - 1) * TH / 2 + TH * 0.15;
}

/* ============================================================
   绘制辅助
   ============================================================ */
function isoBox(cx, cy, hw, hd, h, hue, sat, light, alpha = 1) {
  const topY = cy - h;
  ctx.beginPath();
  ctx.moveTo(cx - hw, topY); ctx.lineTo(cx, topY + hd);
  ctx.lineTo(cx, cy + hd); ctx.lineTo(cx - hw, cy); ctx.closePath();
  ctx.fillStyle = `hsla(${hue},${sat}%,${light - 16}%,${alpha})`; ctx.fill();

  ctx.beginPath();
  ctx.moveTo(cx + hw, topY); ctx.lineTo(cx, topY + hd);
  ctx.lineTo(cx, cy + hd); ctx.lineTo(cx + hw, cy); ctx.closePath();
  ctx.fillStyle = `hsla(${hue},${sat}%,${light - 4}%,${alpha})`; ctx.fill();

  ctx.beginPath();
  ctx.moveTo(cx, topY - hd); ctx.lineTo(cx + hw, topY);
  ctx.lineTo(cx, topY + hd); ctx.lineTo(cx - hw, topY); ctx.closePath();
  ctx.fillStyle = `hsla(${hue},${sat}%,${light + 12}%,${alpha})`; ctx.fill();
}

function drawCylinder(cx, cy, rx, ry, h, hue, sat, light) {
  ctx.beginPath();
  ctx.moveTo(cx - rx, cy);
  ctx.lineTo(cx - rx, cy - h);
  ctx.ellipse(cx, cy - h, rx, ry, 0, Math.PI, 0, true);
  ctx.lineTo(cx + rx, cy);
  ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI);
  ctx.closePath();
  const g = ctx.createLinearGradient(cx - rx, 0, cx + rx, 0);
  g.addColorStop(0, `hsl(${hue},${sat}%,${light - 18}%)`);
  g.addColorStop(0.5, `hsl(${hue},${sat}%,${light}%)`);
  g.addColorStop(1, `hsl(${hue},${sat}%,${light - 10}%)`);
  ctx.fillStyle = g;
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(cx, cy - h, rx, ry, 0, 0, Math.PI * 2);
  ctx.fillStyle = `hsl(${hue},${sat}%,${light + 14}%)`;
  ctx.fill();
}

function drawGlowDot(x, y, hue, t, r = 4) {
  const pulse = 1 + Math.sin(t * 3) * 0.25;
  const g = ctx.createRadialGradient(x, y, 0, x, y, r * 6 * pulse);
  g.addColorStop(0, `hsla(${hue},100%,75%,.95)`);
  g.addColorStop(0.35, `hsla(${hue},100%,65%,.35)`);
  g.addColorStop(1, `hsla(${hue},100%,60%,0)`);
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, y, r * 6 * pulse, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fillStyle = `hsl(${hue},100%,85%)`; ctx.fill();
}

/* ============================================================
   Architectural collection — original pastel isometric world.
   Each category uses a distinct silhouette, 5 evolution levels.
   ============================================================ */
const MV_PALETTES = {
  sport:   {top:'#f5d8cc', left:'#c98e88', right:'#e8aaa2', trim:'#fff3de', deep:'#905c66', mark:'#df8b88'},
  read:    {top:'#dbe4e5', left:'#7d9daa', right:'#a8c1c5', trim:'#fff7e6', deep:'#517b91', mark:'#e6b078'},
  tidy:    {top:'#d6e0c8', left:'#83a096', right:'#a9c3ae', trim:'#faf6df', deep:'#527d76', mark:'#d8a18c'},
  morning: {top:'#f6dbb1', left:'#d7a380', right:'#ebbf93', trim:'#fff5df', deep:'#b77665', mark:'#e9a95f'},
  social:  {top:'#ead9e9', left:'#a18da9', right:'#c3a6bd', trim:'#fbf3e9', deep:'#795e8f', mark:'#e2b477'},
  create:  {top:'#d1e9e1', left:'#84b7b2', right:'#a8d3c8', trim:'#fff6df', deep:'#4f9ea8', mark:'#e8bd84'}
};
function mvPoly(points, color, stroke) {
  ctx.beginPath();ctx.moveTo(points[0][0],points[0][1]);
  for(let i=1;i<points.length;i++)ctx.lineTo(points[i][0],points[i][1]);
  ctx.closePath();ctx.fillStyle=color;ctx.fill();
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=.65;ctx.stroke();}
}
function mvBox(x,y,hw,hd,h,p,topColor) {
  const a=[x-hw,y-h], b=[x,y-h+hd], c=[x+hw,y-h], d=[x,y-h-hd];
  mvPoly([a,b,[x,y+hd],[x-hw,y]],p.left);
  mvPoly([b,c,[x+hw,y],[x,y+hd]],p.right);
  mvPoly([d,c,b,a],topColor || p.top,'rgba(255,255,255,.22)');
}
function mvDot(x,y,r,color){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();}
function mvEllipse(x,y,rx,ry,color){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();}
function mvLine(x1,y1,x2,y2,color,w=1){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.strokeStyle=color;ctx.lineWidth=w;ctx.stroke();}
function mvDiamond(x,y,rx,ry,color){mvPoly([[x,y-ry],[x+rx,y],[x,y+ry],[x-rx,y]],color);}
function mvStair(x,y,n,w,p,direction=1){
  for(let i=0;i<n;i++){
    const xx=x+direction*(i-n/2)*3.2;
    mvBox(xx,y-i*3.25,w-i*.35,2.5,2.6,p,i%2===0?p.trim:p.top);
  }
}
function mvPortal(x,y,w,h,color){
  const b=y, top=y-h;
  ctx.beginPath();ctx.moveTo(x-w/2,b);ctx.lineTo(x-w/2,top+w*.4);
  ctx.quadraticCurveTo(x-w/2,top,x,top);
  ctx.quadraticCurveTo(x+w/2,top,x+w/2,top+w*.4);
  ctx.lineTo(x+w/2,b);ctx.closePath();ctx.fillStyle=color;ctx.fill();
  mvLine(x-w/2+1,b-1,x-w/2+1,top+w*.48,'rgba(255,255,255,.23)',.8);
}
function mvFinial(x,y,p,r=3){
  mvDiamond(x,y,r,r*1.5,p.mark);mvDot(x,y-r*1.4,1.25,p.trim);
}
function mvRoof(x,y,w,p){
  mvPoly([[x-w,y],[x,y-w*.9],[x+w,y],[x,y+w*.36]],p.mark);
  mvPoly([[x-w,y],[x,y+w*.36],[x,y+2.3],[x-w,y+1.8]],p.left);
  mvPoly([[x+w,y],[x,y+w*.36],[x,y+2.3],[x+w,y+1.8]],p.right);
}

function makeBuildingSprite(cat,stage){
  const key=cat+':'+stage;
  if(buildingSprites.has(key))return buildingSprites.get(key);
  const W=160,H=168,dpr=2;
  const off=document.createElement('canvas');off.width=W*dpr;off.height=H*dpr;
  const offCtx=off.getContext('2d');offCtx.setTransform(dpr,0,0,dpr,0,0);
  withCtx(offCtx,()=>paintArchitecture(W/2,132,cat,stage,0));
  buildingSprites.set(key,off);
  return off;
}

  ctx.restore();
  ctx.save();ctx.globalAlpha=dark?.06:.16;
  mvEllipse(VW*.17,VH*.92,VW*.25,VH*.11,dark?'#2a3b33':'#fff8e8');
  mvEllipse(VW*.80,VH*.97,VW*.33,VH*.10,dark?'#2a3b33':'#fffaf0');

function drawRoads(){

  const map=new Map(state.habits.map(h=>[`${h.gx},${h.gy}`,h]));
  for(const h of state.habits){
    if(getStage(h.count)<1)continue;
    const a=isoToScreen(h.gx,h.gy);
    for(const [dx,dy] of [[1,0],[0,1]]){
      const other=map.get(`${h.gx+dx},${h.gy+dy}`);

function drawPulses(){

function render(t){
  drawBackdrop(t);
  const s=viewScale*userZoom;
  ctx.save();
  ctx.translate(VW/2+panX,VH/2+panY);
  ctx.scale(s,s);ctx.translate(-VW/2,-VH/2);
  drawGrid();drawRoads();drawHoverCell(t);
  state.habits.slice().sort((a,b)=>(a.gx+a.gy)-(b.gx+b.gy))
    .forEach(h=>drawHabitBuilding(h,t));
  drawPulses();drawFloaters();
  ctx.restore();
}
let lastSceneFrame=0;
function loop(now){
  if(now-lastSceneFrame>=32){render(now/1000);lastSceneFrame=now;}
  requestAnimationFrame(loop);
}

/* ============================================================
   坐标与拾取
   ============================================================ */
function clientToLogical(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  const px = clientX - rect.left;
  const py = clientY - rect.top;
  const s = viewScale * userZoom;
  return {
    x: (px - VW / 2 - panX) / s + VW / 2,
    y: (py - VH / 2 - panY) / s + VH / 2,
  };
}

function pickCell(x, y) {
  const dx = x - ORIGIN_X, dy = y - ORIGIN_Y;
  const gx = Math.round(dx / TW + dy / TH);
  const gy = Math.round(dy / TH - dx / TW);
  if (gx < 0 || gx >= GRID || gy < 0 || gy >= GRID) return null;
  return { gx, gy };
}

function pickTarget(x, y) {
  const items = state.habits.slice()
    .sort((a, b) => (b.gx + b.gy) - (a.gx + a.gy));
  for (const h of items) {
    const p = isoToScreen(h.gx, h.gy);
    const top = p.y - [27,42,52,75,113][getStage(h.count)];
    const pad = 30 / (viewScale * userZoom);
    if (x > p.x - pad && x < p.x + pad && y > top - 20 / (viewScale * userZoom) && y < p.y + 15 / (viewScale * userZoom)) {
      return { type: 'habit', habit: h };
    }
  }

  const cell = pickCell(x, y);
  if (cell && !isOccupied(cell.gx, cell.gy)) return { type: 'cell', gx: cell.gx, gy: cell.gy };
  return null;
}

    const t = e.touches[0];
    gesture.mode = 'pan'; gesture.moved = false;
    gesture.startX = t.clientX; gesture.startY = t.clientY;
    gesture.startPanX = panX; gesture.startPanY = panY;
  } else if (e.touches.length === 2) {
    e.preventDefault();
    const [a, b] = e.touches;
    const rect = canvas.getBoundingClientRect();
    const mx = (a.clientX + b.clientX) / 2;
    const my = (a.clientY + b.clientY) / 2;
    const rawMx = mx - rect.left;
    const rawMy = my - rect.top;
    const s = viewScale * userZoom;
    gesture.mode = 'pinch'; gesture.moved = true;
    gesture.startDist = Math.hypot(b.clientX - a.clientX, b.clientY - a.clientY) || 1;
    gesture.startZoom = userZoom;
    gesture.startPanX = panX; gesture.startPanY = panY;
    gesture.startMx = mx; gesture.startMy = my;
    gesture.anchorLX = (rawMx - VW / 2 - panX) / s + VW / 2;
    gesture.anchorLY = (rawMy - VH / 2 - panY) / s + VH / 2;
  }
}, { passive: false });

canvas.addEventListener('touchmove', (e) => {
  if (gesture.mode === 'pan' && e.touches.length === 1) {
    const t = e.touches[0];
    const dx = t.clientX - gesture.startX;
    const dy = t.clientY - gesture.startY;
    if (!gesture.moved && Math.hypot(dx, dy) > 8) gesture.moved = true;
    if (gesture.moved) {
      e.preventDefault();
      panX = gesture.startPanX + dx;
      panY = gesture.startPanY + dy;
    }
  } else if (gesture.mode === 'pinch' && e.touches.length === 2) {
    e.preventDefault();
    const [a, b] = e.touches;
    const dist = Math.hypot(b.clientX - a.clientX, b.clientY - a.clientY) || 1;
    const ratio = dist / gesture.startDist;
    const newZoom = clampZoom(gesture.startZoom * ratio);
    const sOld = viewScale * gesture.startZoom;
    const sNew = viewScale * newZoom;
    let nx = gesture.startPanX + (gesture.anchorLX - VW / 2) * (sOld - sNew);
    let ny = gesture.startPanY + (gesture.anchorLY - VH / 2) * (sOld - sNew);
    const rect = canvas.getBoundingClientRect();
    const mx = (a.clientX + b.clientX) / 2;
    const my = (a.clientY + b.clientY) / 2;
    const rawMx = mx - rect.left;
    const rawMy = my - rect.top;
    const rawStartMx = gesture.startMx - rect.left;
    const rawStartMy = gesture.startMy - rect.top;
    nx += rawMx - rawStartMx;
    ny += rawMy - rawStartMy;
    panX = nx; panY = ny;
    userZoom = newZoom;
  }
}, { passive: false });

canvas.addEventListener('touchend', (e) => {
  if (gesture.mode === 'pan' && !gesture.moved && e.changedTouches.length) {
    lastTouchEnd = performance.now();
    const t = e.changedTouches[0];
    handleTap(t.clientX, t.clientY);
  }
  if (e.touches.length === 0) gesture.mode = null;
}, { passive: true });

let mouseDrag = null;
let suppressClick = false;
let lastTouchEnd = 0;

canvas.addEventListener('mousedown', (e) => {
  if (e.button !== 0) return;
  mouseDrag = { sx: e.clientX, sy: e.clientY, px: panX, py: panY, moved: false };
});

window.addEventListener('mousemove', (e) => {
  if (!mouseDrag) return;
  const dx = e.clientX - mouseDrag.sx;
  const dy = e.clientY - mouseDrag.sy;
  if (!mouseDrag.moved && Math.hypot(dx, dy) > 5) {
    mouseDrag.moved = true;
    canvas.classList.add('dragging');
  }
  if (mouseDrag.moved) {
    panX = mouseDrag.px + dx;
    panY = mouseDrag.py + dy;
  }
});

window.addEventListener('mouseup', () => {
  if (!mouseDrag) return;
  suppressClick = mouseDrag.moved;
  mouseDrag = null;
  canvas.classList.remove('dragging');
  if (suppressClick) setTimeout(() => { suppressClick = false; }, 0);
});

canvas.addEventListener('click', (e) => {
  if (suppressClick || performance.now() - lastTouchEnd < 650) return;
  handleTap(e.clientX, e.clientY);
});

canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const rawX = e.clientX - rect.left;
  const rawY = e.clientY - rect.top;
  const factor = e.deltaY < 0 ? 1.12 : 0.89;
  const newZoom = clampZoom(userZoom * factor);
  const sOld = viewScale * userZoom;
  const sNew = viewScale * newZoom;
  const lx = (rawX - VW / 2 - panX) / sOld + VW / 2;
  const ly = (rawY - VH / 2 - panY) / sOld + VH / 2;
  panX = panX + (lx - VW / 2) * (sOld - sNew);
  panY = panY + (ly - VH / 2) * (sOld - sNew);
  userZoom = newZoom;
}, { passive: false });

canvas.addEventListener('mousemove', (e) => {
  if (e.pointerType === 'touch' || mouseDrag) return;
  const p = clientToLogical(e.clientX, e.clientY);
  const t = pickTarget(p.x, p.y);
  hoverCell = (t && t.type === 'cell') ? { gx: t.gx, gy: t.gy } : null;
});
canvas.addEventListener('mouseleave', () => { hoverCell = null; });

function handleTap(clientX, clientY) {
  const p = clientToLogical(clientX, clientY);
  const t = pickTarget(p.x, p.y);
  if (!t) {
    if (state.panel === 'detail') {
      state.panel = null; state.selectedId = null; renderPanel();
    }
    return;
  }
  if (t.type === 'habit') {
    state.panel = 'detail';
    state.selectedId = t.habit.id;
    renderPanel();
  } else {
    openCreateModal({ gx: t.gx, gy: t.gy });
  }
}

function zoomWorld(factor){userZoom=clampZoom(userZoom*factor);}
document.getElementById('zoomIn').addEventListener('click',()=>zoomWorld(1.25));
document.getElementById('zoomOut').addEventListener('click',()=>zoomWorld(.8));

/* ============================================================
   业务
   ============================================================ */
function createHabit(name, category, pos) {
  let target = pos || null;
  if (target && isOccupied(target.gx, target.gy)) target = null;
  if (!target) target = findFreePos();
  if (!target) { alert('星球地块已满啦。可以先拆除一些旧建筑，或扩张星球来增加地块。'); return null; }
  const habit = normalizeHabit({
    id: 'h' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    name: (name || '').trim() || CATEGORIES[category].example,
    category, count: 0, gx: target.gx, gy: target.gy,
    createdAt: new Date().toISOString(),
    lastSettledDate: dayKey(startOfDay(new Date())),
    milestones: [], log: [],
  });
  state.habits.push(habit);
  save();
  const p = isoToScreen(habit.gx, habit.gy);
  pulses.push({ x: p.x, y: p.y - 10, t0: performance.now(), dur: 1200, hue: CATEGORIES[category].hue });
  return habit;
}

function doCheckIn(habit) {
  habit.log = habit.log || [];
  habit.log.push(new Date().toISOString());
  habit.count += 1;

  const ms = MILESTONES.find(m => m.at === habit.count);
  if (ms) {
    habit.milestones = habit.milestones || [];
    habit.milestones.push({ count: habit.count, name: ms.name, date: new Date().toISOString() });
    const p = isoToScreen(habit.gx, habit.gy);
    pulses.push({ x: p.x, y: p.y - 10, t0: performance.now(), dur: 1800, hue: CATEGORIES[habit.category].hue });
  }

  const p = isoToScreen(habit.gx, habit.gy);
  floaters.push({
    x: p.x + (Math.random() - 0.5) * 14, y: p.y - 46, text: '+1',
    color: `hsl(${CATEGORIES[habit.category].hue},95%,72%)`,
    t0: performance.now(), dur: 1400,
  });

  save();
  updateHeader();
  renderPanel();
}

function interruptHabit(habit) {
  if (habit.count <= 0) return;
  const nextCount = habit.count - 1;
  const willDestroy = nextCount <= 0;
  const msg = willDestroy
    ? `确定要中断「${habit.name}」吗？\n当前累计 ${habit.count} 次，中断后归零，建筑将立即销毁。`
    : `确定要中断「${habit.name}」吗？\n将扣除 1 次打卡数（当前 ${habit.count} 次）。`;
  if (!confirm(msg)) return;

  habit.count = Math.max(0, nextCount);
  if (willDestroy) {
    state.habits = state.habits.filter(h => h.id !== habit.id);
    state.panel = null;
    state.selectedId = null;
    const cat = CATEGORIES[habit.category];
    const mask = document.createElement('div');
    mask.className = 'modal-mask';
    mask.innerHTML = `
      <div class="modal">
        <h3>💔 习惯中断，建筑已销毁</h3>
        <div class="hint">「${escapeHtml(habit.name)}」因中断，打卡次数归零，建筑已从星球上移除。</div>
        <div class="destroyed-item">
          <div class="ico">${cat.icon}</div>
          <div>
            <div>${escapeHtml(habit.name)}</div>
            <div class="sub">${cat.name}系 · 打卡次数已归零</div>
          </div>
        </div>
        <div class="modal-actions"><button class="btn primary" data-close>知道了</button></div>
      </div>
    `;
    document.body.appendChild(mask);
    mask.addEventListener('click', (e) => {
      if (e.target === mask || e.target.closest('[data-close]')) mask.remove();
    });
  } else {
    const p = isoToScreen(habit.gx, habit.gy);
    floaters.push({
      x: p.x, y: p.y - 46, text: '-1',
      color: '#fca5a5',
      t0: performance.now(), dur: 1400,
    });
  }
  save();
  updateHeader();
  renderPanel();
}

function deleteHabit(habit) {
  if (!confirm(`确定要拆除「${habit.name}」的全部建筑吗？\n累计 ${habit.count} 次的记录也会一并删除，且无法恢复。`)) return;
  state.habits = state.habits.filter(h => h.id !== habit.id);
  state.panel = null;
  state.selectedId = null;
  save(); updateHeader(); renderPanel();
}

/* ============================================================
   统计
   ============================================================ */
function countLinks() {
  let n = 0;
  const map = new Map();
  state.habits.forEach(h => map.set(`${h.gx},${h.gy}`, h));
  state.habits.forEach(h => {
    if (getStage(h.count) < 1) return;
    [[1, 0], [0, 1]].forEach(([dx, dy]) => {
      const o = map.get(`${h.gx + dx},${h.gy + dy}`);
      if (o && getStage(o.count) >= 1) n++;
    });
  });
  return n;
}
function computeCiv() {
  const byStage = [0, 0, 0, 0, 0];
  const byCat = {};
  Object.keys(CATEGORIES).forEach(k => { byCat[k] = 0; });
  let base = 0;
  state.habits.forEach(h => {
    const s = getStage(h.count);
    byStage[s]++;
    const sc = STAGE_SCORE[s];
    base += sc;
    byCat[h.category] += sc;
  });
  const links = countLinks();
  const linkBonus = links * LINK_BONUS;
  const diversity = Object.keys(byCat).filter(k => byCat[k] > 0).length;
  const diversityBonus = diversity * DIVERSITY_BONUS;
  const total = base + linkBonus + diversityBonus;
  let tierIdx = 0;
  for (let i = 0; i < CIV_TIERS.length; i++) if (total >= CIV_TIERS[i].min) tierIdx = i;
  return {
    total, base, linkBonus, diversityBonus, links, diversity,
    byStage, byCat, tier: CIV_TIERS[tierIdx], next: CIV_TIERS[tierIdx + 1] || null, tierIdx,
  };
}
function updateHeader() {
  const totalChecks = state.habits.reduce((s, h) => s + h.count, 0);
  const built = state.habits.filter(h => getStage(h.count) >= 1).length;
  const wonders = state.habits.filter(h => getStage(h.count) >= 4).length;
  const civ = computeCiv();
  document.getElementById('headerStats').innerHTML = `
    <div class="civ">文明度 <b>${civ.total}</b></div>
    <div>打卡 <b>${totalChecks}</b></div>
    <div>建筑 <b>${built}</b></div>
    <div>奇观 <b>${wonders}</b></div>
  `;
}

const panelEl = document.getElementById('panel');
const panelMask = document.getElementById('panelMask');

function updateFabActive() {
  document.querySelectorAll('.fab').forEach(btn => {
    const match = state.panel === 'detail' ? btn.dataset.panel === 'list' : btn.dataset.panel === state.panel;
    btn.classList.toggle('active', match);
  });
}
function closePanel() {
  state.panel = null;
  state.selectedId = null;
  panelMask.classList.remove('show');
  panelEl.innerHTML = '';
  updateFabActive();
}
function renderPanel() {
  if (!state.panel) {
    panelMask.classList.remove('show');
    panelEl.innerHTML = '';
    updateFabActive();
    return;
  }
  panelMask.classList.add('show');

  let body = '';
  if (state.panel === 'detail') {
    const h = state.habits.find(x => x.id === state.selectedId);
    body = h ? detailHTML(h) : listHTML();
  } else if (state.panel === 'codex') body = codexHTML();
  else if (state.panel === 'develop') body = developHTML();
  else if (state.panel === 'yearbook') body = yearbookHTML();
  else body = listHTML();

  panelEl.innerHTML = body;
  updateFabActive();
  if (state.panel === 'codex') renderCodexCanvases();
}

document.querySelectorAll('.fab').forEach(btn => {
  btn.addEventListener('click', () => {
    const p = btn.dataset.panel;
    if (state.panel === p) closePanel();
    else { state.panel = p; state.selectedId = null; renderPanel(); }

});

panelMask.addEventListener('click', (e) => {

/* ============================================================
   图鉴预览绘制
   ============================================================ */
function withCtx(targetCtx, fn) {
  const prev = ctx;
  ctx = targetCtx;
  try { fn(); } finally { ctx = prev; }
}

function renderPreview(cv, category, stage) {
  const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  const W = 110, H = 118;
  cv.width = Math.round(W * dpr);
  cv.height = Math.round(H * dpr);
  cv.style.width = W + 'px';
  cv.style.height = H + 'px';

  const c2 = cv.getContext('2d');
  c2.setTransform(dpr, 0, 0, dpr, 0, 0);
  c2.clearRect(0, 0, W, H);

  const hue = CATEGORIES[category].hue;
  const dark = isDarkMode();
  const bg = c2.createRadialGradient(W / 2, 76, 4, W / 2, 76, 62);
  bg.addColorStop(0, `hsla(${hue},${dark?55:80}%,${dark?42:60}%,${dark?.10:.13})`);
  bg.addColorStop(1, 'hsla(0,0%,0%,0)');
  c2.fillStyle = bg;
  c2.fillRect(0, 0, W, H);

  const cfg = [
    { scale: 1.16, baseY: 87 },
    { scale: 1.06, baseY: 90 },
    { scale: 0.98, baseY: 93 },
    { scale: 0.86, baseY: 100 },
    { scale: 0.72, baseY: 106 },
  ][stage] || { scale: 0.80, baseY: 84 };

  withCtx(c2, () => {
    c2.save();
    c2.translate(W / 2, cfg.baseY);
    c2.scale(cfg.scale, cfg.scale);
    c2.translate(-W / 2, -cfg.baseY);

    c2.beginPath();
    c2.ellipse(W / 2, cfg.baseY + 4, 24, 11, 0, 0, Math.PI * 2);
    c2.fillStyle = dark ? 'rgba(0,0,0,.4)' : 'rgba(0,0,0,.32)';
    c2.fill();

    if (category === 'read') drawRead(W / 2, cfg.baseY, stage, 0.9);
    else if (category === 'sport') drawSport(W / 2, cfg.baseY, stage, 0.9);
    else if (category === 'create') drawCreate(W / 2, cfg.baseY, stage, 0.9);
    else if (category === 'tidy') drawTidy(W / 2, cfg.baseY, stage, 0.9);
    else if (category === 'morning') drawMorning(W / 2, cfg.baseY, stage, 0.9);
    else if (category === 'social') drawSocial(W / 2, cfg.baseY, stage, 0.9);

    c2.restore();
  });
}

function renderCodexCanvases() {

function developHTML() {

  const nextText = next ? `距「${next.icon} ${next.name}」还需 ${Math.max(0, next.min - civ.total)} 点` : '已达到最高文明等级';

  }).join('');

  const civCodex = CIV_TIERS.map((t, i) => {

  const totalCells = GRID * GRID;

  const needMore = Math.max(0, Math.ceil(totalCells * 0.7) - occupied);

  const expandHTML = `
    <div class="section-title">星球扩张</div>
    <div class="expand-card">
      <div class="expand-line"><span class="k">当前地块</span><span class="v">${GRID} × ${GRID} = ${totalCells} 格</span></div>
      <div class="expand-line"><span class="k">已占建筑</span><span class="v ${occPct >= 70 ? 'ok' : ''}">${occupied} 个（${occPct.toFixed(0)}%）</span></div>
      <div class="expand-bar"><i style="width:${Math.min(100, occPct)}%"></i></div>
      <div class="expand-hint">
        ${isMax ? '星球已达最大规模（11 × 11 = 121 格）。'
          : canExp ? '建筑已占现有地块 70% 以上，可以扩张星球，获得更多地块。'
          : `建筑需占现有地块 70% 才能扩张，还差 ${needMore} 个建筑。`}
      </div>
      <button class="btn ${canExp ? 'primary' : ''}" data-action="expand" ${canExp ? '' : 'disabled'} style="width:100%;padding:10px">
        ${isMax ? '已达最大规模' : canExp ? `扩张星球 → ${GRID_LEVELS[gridLevel + 1]} × ${GRID_LEVELS[gridLevel + 1]}` : '继续建造以满足条件'}
      </button>
    </div>
  `;

  return `
    ${panelHeader('文明发展', '文明等级 · 扩展 · 贡献分析')}
    <div class="civ-hero">
      <div class="n">${civ.total}</div>
      <div class="tier">${tier.icon} ${tier.name}</div>
      <div class="sub">文明程度 · 由全部习惯建筑的等级与协同共同决定</div>
      <div class="progress-bar"><i style="width:${pct}%"></i></div>
      <div class="progress-meta">
        <span>${tier.min}</span>
        <span style="color:var(--accent)">${nextText}</span>
        <span>${next ? next.min : 'MAX'}</span>
      </div>
    </div>

    <div class="section-title">文明进化图鉴</div>
    <div class="civ-codex">${civCodex}</div>
    <div style="font-size:10.5px;color:var(--muted);line-height:1.7;padding:0 4px">
      当前阶段：${tier.desc}
    </div>

    ${expandHTML}

    <div class="section-title">文明度构成</div>
    <div style="display:flex;flex-direction:column;gap:7px">
      <div class="civ-row"><span class="k">🏗️ 建筑基础分</span><span class="v">+${civ.base}</span></div>
      <div class="civ-row"><span class="k">🔗 相邻协同（${civ.links} 处 × ${LINK_BONUS}）</span><span class="v">+${civ.linkBonus}</span></div>
      <div class="civ-row"><span class="k">🌈 属性多样性（${civ.diversity} 种 × ${DIVERSITY_BONUS}）</span><span class="v">+${civ.diversityBonus}</span></div>
    </div>

    <div class="section-title">建筑阶段分布</div>
    <div style="display:flex;flex-direction:column;gap:8px">${stageRows}</div>

    <div class="section-title">属性贡献</div>
    <div style="display:flex;flex-direction:column;gap:8px">${catRows}</div>

    <div style="font-size:10.5px;color:var(--muted);line-height:1.7;padding:4px">
      评分规则：地基 0 分、初级设施 10 分、小镇 30 分、城市区域 80 分、奇观 200 分。
      相邻两块已建成地块各 +${LINK_BONUS} 分，每多一种属性 +${DIVERSITY_BONUS} 分。
    </div>
  `;
}

function detailHTML(h) {
  const cat = CATEGORIES[h.category];
  const stage = getStage(h.count);
  const pr = progressInfo(h.count);
  const today = todayKey();
  const todayCount = (h.log || []).filter(s => {
    const d = new Date(s);
    return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}` === today;
  }).length;

  const msMap = new Map((h.milestones || []).map(m => [m.count, m]));
  const timeline = MILESTONES.map(m => {
    const done = h.count >= m.at;
    const rec = msMap.get(m.at);
    return `
      <div class="tl-item">
        <div class="tl-dot ${done ? 'done' : ''}">${done ? '✓' : ''}</div>
        <div class="tl-body">
          <div class="t" style="${done ? '' : 'color:#aeb9ae'}">${m.name}</div>
          <div class="d">${done ? `${m.at} 次 · ${fmtDate(rec ? rec.date : h.createdAt)}` : `还差 ${m.at - h.count} 次`}</div>
        </div>
      </div>`;
  }).join('');

  const nextLabel = pr.next ? `距「${STAGE_NAMES[stage + 1]}」还需 ${pr.next - h.count} 次` : '已成为文明奇观';

  return `
    <div style="display:flex;gap:8px;margin-bottom:4px">
      <button class="btn ghost" style="padding:6px 10px" data-action="back">← 总览</button>
      <button class="btn ghost" style="padding:6px 10px;margin-left:auto" data-action="close">×</button>
    </div>
    <div class="detail-head">
      <div class="big-ico">${cat.icon}</div>
      <div>
        <h2>${escapeHtml(h.name)}</h2>
        <div class="tag">${cat.name}系 · ${CATEGORY_STAGE_NAMES[h.category][stage]}</div>
      </div>
    </div>
    <div class="big-count">
      <div class="n">${h.count}</div>
      <div class="lbl">累计打卡次数</div>
    </div>
    <div class="progress-wrap">
      <div class="progress-bar"><i style="width:${pr.pct}%;background:linear-gradient(90deg,#89b6a4,#d9b9a2)"></i></div>
      <div class="progress-meta">
        <span>${pr.from} 次</span>
        <span style="color:var(--accent)">${nextLabel}</span>
        <span>${pr.to} 次</span>
      </div>
    </div>
    <div style="font-size:11px;color:var(--muted);text-align:center;margin-top:-4px">
      今日已打卡 <b style="color:var(--accent)">${todayCount}</b> 次 · 地块 (${h.gx}, ${h.gy})
    </div>
    <div class="action-row">
      <button class="btn primary" data-action="checkin" data-id="${h.id}">打卡 +1</button>
      <button class="btn warn" data-action="interrupt" data-id="${h.id}" ${h.count <= 0 ? 'disabled' : ''}>中断 -1</button>
    </div>
    <div style="font-size:10px;color:var(--muted);text-align:center;margin-top:2px">
      中断一天扣除 ${DECAY_PENALTY} 次打卡数，归零即销毁
    </div>
    <div class="section-title">进化档案</div>
    <div class="timeline">${timeline}</div>
    <button class="btn danger" style="margin-top:6px" data-action="delete" data-id="${h.id}">拆除这座建筑</button>
  `;
}

function yearbookHTML() {
  const entries = [];
  for (const h of state.habits) {
    const cat = CATEGORIES[h.category];
    entries.push({ date: h.createdAt, icon: cat.icon, text: `「${h.name}」在星球 (${h.gx}, ${h.gy}) 落成地基` });
    for (const m of (h.milestones || [])) {
      entries.push({ date: m.date, icon: '✨', text: `「${h.name}」${m.name}（累计 ${m.count} 次）` });
    }
  }
  entries.sort((a, b) => new Date(b.date) - new Date(a.date));
  const body = entries.length
    ? entries.slice(0, 80).map(e => `
        <div class="yb-item">
          <div class="yb-icon">${e.icon}</div>
          <div class="yb-body">
            <div class="t">${escapeHtml(e.text)}</div>
            <div class="d">${fmtDate(e.date)}</div>
          </div>
        </div>`).join('')
    : `<div class="empty"><span class="big">📜</span>年鉴还是空白的<br>每一次打卡都会在这里留下痕迹</div>`;
  return `
    ${panelHeader('文明年鉴', '记录这颗星球上发生过的每一次进化')}
    <div>${body}</div>
  `;
}

/* ============================================================
   面板事件委托
   ============================================================ */
panelEl.addEventListener('click', (e) => {
  const target = e.target.closest('[data-action]');
  if (!target) return;
  const action = target.dataset.action;
  const id = target.dataset.id;

  if (action === 'close') { closePanel(); return; }
  if (action === 'select') {
    state.panel = 'detail'; state.selectedId = id; renderPanel();
  } else if (action === 'back') {
    state.panel = 'list'; state.selectedId = null; renderPanel();
  } else if (action === 'codexCat') {
    state.codexCategory = target.dataset.cat; renderPanel();
  } else if (action === 'new') {
    openCreateModal(null);
  } else if (action === 'checkin') {
    const h = state.habits.find(x => x.id === id);
    if (h) doCheckIn(h);
  } else if (action === 'interrupt') {
    const h = state.habits.find(x => x.id === id);
    if (h) interruptHabit(h);
  } else if (action === 'delete') {
    const h = state.habits.find(x => x.id === id);
    if (h) deleteHabit(h);
  } else if (action === 'expand') {
    expandPlanet();
  }
});

/* ============================================================
   新建习惯弹窗
   ============================================================ */
function openCreateModal(pos) {
  const mask = document.createElement('div');
  mask.className = 'modal-mask';
  const catBtns = Object.entries(CATEGORIES).map(([key, c]) => `
    <button class="cat-btn ${key === state.newCategory ? 'active' : ''}" data-cat="${key}">
      <span>${c.icon}</span>${c.name}
    </button>`).join('');
  const posHint = pos ? `将在地块 (${pos.gx}, ${pos.gy}) 上落成地基` : '将自动选择星球中心的空地落下地基';
  mask.innerHTML = `
    <div class="modal">
      <h3>开拓新地块</h3>
      <div class="hint">${posHint}<br>每坚持 7 次，这块地基就会建成初级设施。中断一天会扣除 ${DECAY_PENALTY} 次打卡数，归零即销毁。</div>
      <div class="field">
        <label>习惯名称</label>
        <input id="habitName" maxlength="20" placeholder="例如：晨跑 20 分钟" autocomplete="off">
      </div>
      <div class="field">
        <label>选择属性</label>
        <div class="cat-grid" id="catGrid">${catBtns}</div>
      </div>
      <div class="modal-actions">
        <button class="btn ghost" data-close>取消</button>
        <button class="btn primary" style="width:auto;flex:1" data-confirm>落成地基</button>
      </div>
    </div>
  `;
  document.body.appendChild(mask);
  const input = mask.querySelector('#habitName');
  setTimeout(() => input.focus(), 60);
  let selectedCat = state.newCategory;
  input.placeholder = '例如：' + CATEGORIES[selectedCat].example;
  mask.querySelector('#catGrid').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-cat]');
    if (!btn) return;
    selectedCat = btn.dataset.cat;
    state.newCategory = selectedCat;
    mask.querySelectorAll('.cat-btn').forEach(b => b.classList.toggle('active', b.dataset.cat === selectedCat));
    input.placeholder = '例如：' + CATEGORIES[selectedCat].example;
  });
  const close = () => mask.remove();
  mask.addEventListener('click', (e) => {
    if (e.target === mask || e.target.closest('[data-close]')) close();
  });
  const confirmCreate = () => {
    const name = input.value.trim() || CATEGORIES[selectedCat].example;
    const h = createHabit(name, selectedCat, pos);
    if (h) {
      state.panel = 'detail'; state.selectedId = h.id;
      updateHeader(); renderPanel(); close();
    }
  };
  mask.querySelector('[data-confirm]').addEventListener('click', confirmCreate);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') confirmCreate();
    if (e.key === 'Escape') close();
  });
}

/* ============================================================
   示例数据
   ============================================================ */
function seedDemo() {
  const today = dayKey(startOfDay(new Date()));
  const demo = [
    { name: '晨跑 20 分钟', category: 'sport', count: 12, gx: 0, gy: 0 },
    { name: '阅读 20 页',   category: 'read',  count: 34, gx: 1, gy: 0 },
    { name: '睡前整理桌面', category: 'tidy',  count: 55, gx: 2, gy: 0 },
    { name: '随手画草图',   category: 'create', count: 21, gx: 0, gy: 1 },
    { name: '早起一杯水',   category: 'morning', count: 7, gx: 1, gy: 1 },
    { name: '给朋友发消息', category: 'social', count: 49, gx: 2, gy: 1 },
  ];
  demo.forEach((d, i) => {
    if (isOccupied(d.gx, d.gy)) return;
    state.habits.push(normalizeHabit({
      id: 'demo' + i, name: d.name, category: d.category, count: d.count,
      gx: d.gx, gy: d.gy,
      createdAt: new Date(Date.now() - (d.count + 10) * 86400000).toISOString(),
      lastSettledDate: today,
      milestones: MILESTONES.filter(m => d.count >= m.at).map(m => ({
        count: m.at, name: m.name,
        date: new Date(Date.now() - (d.count - m.at) * 86400000).toISOString(),
      })),
      log: [],
    }));
  });
  save();
}

/* ============================================================
   启动
   ============================================================ */
(function boot() {
  const hasData = load();
  if (!hasData) seedDemo();
  settleDecay();
  updateHeader();

  requestAnimationFrame(() => {
    initCanvas();
    renderPanel();
    requestAnimationFrame(loop);
  });

  const ro = new ResizeObserver(() => {
    initCanvas();
  });
  ro.observe(stageArea);
})();
</script>
