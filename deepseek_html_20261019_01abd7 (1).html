<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#060a18">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="星球文明">
<title>习惯星球文明 · 离线版</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #060a18;
  --panel: rgba(13, 21, 44, 0.88);
  --line: rgba(90, 160, 240, 0.16);
  --text: #dbeafe;
  --muted: #7f93b8;
  --accent: #5eead4;
  --accent2: #7dd3fc;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: radial-gradient(circle at 50% -10%, #14214a 0%, #060a18 55%);
  color: var(--text);
  overflow: hidden;
  overscroll-behavior: none;
}
#app {
  height: 100%;
  display: grid;
  grid-template-columns: 1fr 390px;
  grid-template-rows: auto 1fr;
  padding-top: var(--safe-top);
}
header {
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 12px 20px;
  border-bottom: 1px solid var(--line);
  background: rgba(6, 10, 24, 0.6);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  z-index: 5;
}
.brand { display: flex; align-items: center; gap: 11px; flex-shrink: 0; }
.brand .logo { font-size: 25px; filter: drop-shadow(0 0 10px rgba(94,234,212,.6)); }
.brand h1 { font-size: 16px; letter-spacing: .5px; font-weight: 700; white-space: nowrap; }
.brand p { font-size: 10.5px; color: var(--muted); margin-top: 2px; white-space: nowrap; }
.header-right { display: flex; align-items: center; gap: 16px; }
.header-stats { display: flex; gap: 16px; font-size: 11.5px; color: var(--muted); flex-wrap: wrap; justify-content: flex-end; }
.header-stats b { color: var(--accent); font-size: 14px; margin-left: 3px; }
.header-stats .civ b { color: #a7f3d0; }
.install-btn {
  padding: 7px 12px;
  font-size: 11.5px;
  flex-shrink: 0;
  background: linear-gradient(135deg, rgba(94,234,212,.14), rgba(56,189,248,.14));
  border-color: rgba(94,234,212,.35);
}

.stage-area {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  padding: 8px;
  min-height: 0;
}
canvas#planet {
  display: block;
  width: 100%;
  max-width: 720px;
  aspect-ratio: 720 / 520;
  cursor: pointer;
  touch-action: manipulation;
}
.tip {
  position: absolute;
  bottom: 12px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 10.5px;
  color: var(--muted);
  background: rgba(10, 16, 34, .7);
  padding: 5px 13px;
  border-radius: 20px;
  border: 1px solid var(--line);
  pointer-events: none;
  white-space: nowrap;
  max-width: 94%;
  overflow: hidden;
  text-overflow: ellipsis;
}

aside {
  border-left: 1px solid var(--line);
  background: var(--panel);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  padding: 16px;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  display: flex;
  flex-direction: column;
  gap: 13px;
  padding-bottom: calc(16px + var(--safe-bottom));
}
aside::-webkit-scrollbar { width: 6px; }
aside::-webkit-scrollbar-thumb { background: rgba(90,160,240,.25); border-radius: 3px; }

.panel-head { display: flex; align-items: center; justify-content: space-between; }
.panel-title { font-size: 13px; font-weight: 700; letter-spacing: 1px; color: var(--accent2); }
.panel-sub { font-size: 11px; color: var(--muted); margin-top: 4px; }

.btn {
  border: 1px solid var(--line);
  background: rgba(94, 234, 212, .08);
  color: var(--accent);
  padding: 8px 14px;
  border-radius: 9px;
  font-size: 12px;
  cursor: pointer;
  transition: all .16s;
  font-family: inherit;
  white-space: nowrap;
  touch-action: manipulation;
}
.btn:hover { background: rgba(94, 234, 212, .18); border-color: rgba(94,234,212,.45); }
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn:disabled:hover { background: rgba(94, 234, 212, .08); border-color: var(--line); }
.btn.primary {
  background: linear-gradient(135deg, #2dd4bf, #38bdf8);
  color: #04202a;
  font-weight: 700;
  border: none;
  padding: 12px 16px;
  font-size: 14px;
  width: 100%;
}
.btn.primary:hover { filter: brightness(1.1); }
.btn.primary:disabled { background: rgba(255,255,255,.08); color: var(--muted); }
.btn.ghost { background: transparent; color: var(--muted); }
.btn.danger { color: #fca5a5; border-color: rgba(248,113,113,.3); background: rgba(248,113,113,.06); }
.btn.danger:hover { background: rgba(248,113,113,.15); }

.tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.tab {
  padding: 9px 3px;
  border-radius: 9px;
  border: 1px solid var(--line);
  background: rgba(255,255,255,.03);
  color: var(--muted);
  font-size: 11px;
  cursor: pointer;
  font-family: inherit;
  transition: all .16s;
  white-space: nowrap;
}
.tab:hover { background: rgba(255,255,255,.07); }
.tab.active {
  color: var(--accent);
  border-color: rgba(94,234,212,.45);
  background: rgba(94,234,212,.12);
  font-weight: 700;
}

.habit-list { display: flex; flex-direction: column; gap: 8px; }
.habit-item {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 10px 11px;
  border-radius: 12px;
  background: rgba(255,255,255,.03);
  border: 1px solid var(--line);
  cursor: pointer;
  transition: all .18s;
}
.habit-item:hover {
  background: rgba(94,234,212,.07);
  border-color: rgba(94,234,212,.35);
  transform: translateX(3px);
}
.habit-item .ico { font-size: 21px; width: 32px; text-align: center; flex-shrink: 0; }
.habit-item .info { flex: 1; min-width: 0; }
.habit-item .name { font-size: 12.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.habit-item .meta { font-size: 10.5px; color: var(--muted); margin-top: 3px; }
.mini-bar { height: 3px; border-radius: 2px; background: rgba(255,255,255,.08); margin-top: 6px; overflow: hidden; }
.mini-bar i { display: block; height: 100%; border-radius: 2px; transition: width .4s; }
.badge {
  font-size: 10px;
  padding: 3px 8px;
  border-radius: 20px;
  border: 1px solid currentColor;
  opacity: .85;
  white-space: nowrap;
  flex-shrink: 0;
}

.empty {
  text-align: center;
  color: var(--muted);
  font-size: 12px;
  padding: 32px 10px;
  line-height: 2;
}
.empty .big { font-size: 32px; display: block; margin-bottom: 8px; opacity: .6; }

/* 详情 */
.detail-head { display: flex; align-items: center; gap: 13px; }
.detail-head .big-ico {
  font-size: 28px;
  width: 54px; height: 54px;
  display: grid; place-items: center;
  border-radius: 16px;
  background: rgba(255,255,255,.05);
  border: 1px solid var(--line);
  flex-shrink: 0;
}
.detail-head h2 { font-size: 16px; }
.detail-head .tag { font-size: 10.5px; color: var(--muted); margin-top: 5px; }

.big-count { text-align: center; padding: 12px 0 4px; }
.big-count .n {
  font-size: 44px;
  font-weight: 800;
  line-height: 1;
  background: linear-gradient(180deg, #a7f3d0, #38bdf8);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.big-count .lbl { font-size: 10.5px; color: var(--muted); margin-top: 6px; letter-spacing: 2px; }

.progress-wrap { margin-top: 4px; }
.progress-bar {
  height: 9px;
  border-radius: 5px;
  background: rgba(255,255,255,.07);
  overflow: hidden;
  border: 1px solid rgba(255,255,255,.05);
}
.progress-bar i {
  display: block;
  height: 100%;
  border-radius: 5px;
  background: linear-gradient(90deg, #2dd4bf, #7dd3fc);
  transition: width .5s cubic-bezier(.2,.9,.3,1);
  box-shadow: 0 0 12px rgba(94,234,212,.6);
}
.progress-meta {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  font-size: 10.5px;
  color: var(--muted);
  margin-top: 7px;
}
.progress-meta span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.section-title {
  font-size: 11px;
  letter-spacing: 1.5px;
  color: var(--muted);
  margin: 6px 0 2px;
  text-transform: uppercase;
}

.timeline { display: flex; flex-direction: column; gap: 0; }
.tl-item { display: flex; gap: 10px; padding-bottom: 13px; position: relative; }
.tl-item:not(:last-child)::before {
  content: '';
  position: absolute;
  left: 7px; top: 18px; bottom: 0;
  width: 1px;
  background: linear-gradient(180deg, rgba(94,234,212,.4), rgba(94,234,212,.05));
}
.tl-dot {
  width: 15px; height: 15px;
  border-radius: 50%;
  flex-shrink: 0;
  margin-top: 2px;
  border: 2px solid rgba(94,234,212,.5);
  background: rgba(94,234,212,.15);
  display: grid;
  place-items: center;
  font-size: 8px;
  color: #04202a;
  font-weight: 900;
}
.tl-dot.done { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 10px rgba(94,234,212,.6); }
.tl-body .t { font-size: 12px; font-weight: 600; }
.tl-body .d { font-size: 10.5px; color: var(--muted); margin-top: 3px; }

.civ-stats {
  margin-top: auto;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  padding-top: 13px;
  border-top: 1px solid var(--line);
}
.civ-stats > div {
  text-align: center;
  font-size: 10px;
  color: var(--muted);
  background: rgba(255,255,255,.025);
  padding: 9px 4px;
  border-radius: 10px;
  border: 1px solid var(--line);
}
.civ-stats b { display: block; font-size: 16px; color: var(--accent2); margin-bottom: 3px; }

/* 图鉴 */
.codex-tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.codex-tab {
  padding: 8px 3px;
  border-radius: 9px;
  border: 1px solid var(--line);
  background: rgba(255,255,255,.03);
  color: var(--muted);
  font-size: 11px;
  cursor: pointer;
  font-family: inherit;
  transition: all .16s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.codex-tab:hover { background: rgba(255,255,255,.07); }
.codex-tab.active {
  color: var(--accent);
  border-color: rgba(94,234,212,.45);
  background: rgba(94,234,212,.12);
  font-weight: 700;
}
.codex-list { display: flex; flex-direction: column; gap: 8px; }
.codex-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  border-radius: 13px;
  background: rgba(255,255,255,.03);
  border: 1px solid var(--line);
  transition: all .16s;
}
.codex-row:hover { border-color: rgba(94,234,212,.3); background: rgba(94,234,212,.05); }
.codex-canvas { flex-shrink: 0; display: block; }
.codex-info { flex: 1; min-width: 0; }
.codex-info .t {
  font-size: 12.5px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.codex-info .d { font-size: 10.5px; color: var(--muted); margin-top: 4px; line-height: 1.55; }
.mini-tag {
  font-size: 9px;
  padding: 1px 6px;
  border-radius: 20px;
  border: 1px solid currentColor;
  font-weight: 500;
}
.mini-tag.on { color: var(--accent); }
.mini-tag.off { color: #4b5b7d; }

/* 文明发展 */
.civ-hero {
  text-align: center;
  padding: 16px 14px;
  border-radius: 16px;
  background: linear-gradient(160deg, rgba(45,212,191,.13), rgba(56,189,248,.05));
  border: 1px solid rgba(94,234,212,.22);
}
.civ-hero .n {
  font-size: 42px;
  font-weight: 800;
  line-height: 1;
  background: linear-gradient(180deg, #a7f3d0, #38bdf8);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  filter: drop-shadow(0 0 20px rgba(94,234,212,.35));
}
.civ-hero .tier { margin-top: 9px; font-size: 15px; font-weight: 700; color: var(--accent); }
.civ-hero .sub { margin-top: 4px; font-size: 10.5px; color: var(--muted); }
.civ-hero .progress-bar { margin-top: 13px; text-align: left; }
.civ-hero .progress-meta { margin-top: 7px; }

.civ-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 11.5px;
  padding: 8px 11px;
  border-radius: 9px;
  background: rgba(255,255,255,.03);
  border: 1px solid var(--line);
  gap: 10px;
}
.civ-row .k { color: var(--muted); }
.civ-row .v { color: var(--accent); font-weight: 700; white-space: nowrap; }

.stage-row {
  display: flex;
  align-items: center;
  gap: 9px;
  font-size: 11.5px;
}
.stage-row .name { width: 60px; color: var(--muted); flex-shrink: 0; }
.stage-row .bar {
  flex: 1;
  height: 7px;
  border-radius: 4px;
  background: rgba(255,255,255,.06);
  overflow: hidden;
}
.stage-row .bar i {
  display: block;
  height: 100%;
  border-radius: 4px;
  transition: width .5s;
}
.stage-row .num { width: 22px; text-align: right; color: var(--accent2); font-weight: 700; }

.cat-row { display: flex; align-items: center; gap: 9px; font-size: 11.5px; }
.cat-row .ico { width: 20px; text-align: center; font-size: 14px; }
.cat-row .name { width: 40px; color: var(--muted); flex-shrink: 0; }
.cat-row .bar { flex: 1; height: 7px; border-radius: 4px; background: rgba(255,255,255,.06); overflow: hidden; }
.cat-row .bar i { display: block; height: 100%; border-radius: 4px; }
.cat-row .num { width: 38px; text-align: right; color: var(--accent2); font-weight: 700; }

/* 文明进化图鉴卡片 */
.civ-codex { display: flex; flex-direction: column; gap: 7px; }
.civ-card {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 9px 12px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: rgba(255,255,255,.025);
  position: relative;
  overflow: hidden;
  transition: all .2s;
}
.civ-card::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  background: transparent;
  transition: background .2s;
}
.civ-card.reached { background: rgba(94,234,212,.05); border-color: rgba(94,234,212,.22); }
.civ-card.reached::before { background: rgba(94,234,212,.5); }
.civ-card.current {
  background: linear-gradient(90deg, rgba(45,212,191,.18), rgba(56,189,248,.06));
  border-color: rgba(94,234,212,.55);
  box-shadow: 0 0 22px rgba(94,234,212,.15);
}
.civ-card.current::before { background: var(--accent); box-shadow: 0 0 12px rgba(94,234,212,.8); }
.cc-icon {
  font-size: 22px;
  width: 40px; height: 40px;
  display: grid; place-items: center;
  border-radius: 11px;
  background: rgba(0,0,0,.22);
  flex-shrink: 0;
  filter: grayscale(1) opacity(.35);
  transition: filter .2s;
}
.civ-card.reached .cc-icon { filter: none; }
.cc-info { flex: 1; min-width: 0; }
.cc-name { font-size: 12.5px; font-weight: 700; color: #4b5b7d; }
.civ-card.reached .cc-name { color: var(--text); }
.civ-card.current .cc-name { color: var(--accent); }
.cc-req { font-size: 10px; color: var(--muted); margin-top: 2px; }
.cc-state {
  font-size: 9.5px;
  padding: 1px 7px;
  border-radius: 20px;
  border: 1px solid currentColor;
  color: #4b5b7d;
  white-space: nowrap;
}
.civ-card.reached .cc-state { color: var(--accent); }
.civ-card.current .cc-state { color: #04202a; background: var(--accent); border-color: var(--accent); font-weight: 700; }

/* 扩张卡片 */
.expand-card {
  padding: 13px;
  border-radius: 13px;
  background: linear-gradient(160deg, rgba(56,189,248,.09), rgba(94,234,212,.03));
  border: 1px solid rgba(94,234,212,.2);
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.expand-line { display: flex; justify-content: space-between; font-size: 11.5px; }
.expand-line .k { color: var(--muted); }
.expand-line .v { color: var(--text); font-weight: 600; }
.expand-line .v.ok { color: var(--accent); }
.expand-bar {
  height: 7px;
  border-radius: 4px;
  background: rgba(255,255,255,.08);
  overflow: hidden;
  margin-top: 2px;
}
.expand-bar i {
  display: block;
  height: 100%;
  border-radius: 4px;
  background: linear-gradient(90deg, #38bdf8, #2dd4bf);
  transition: width .5s;
}
.expand-hint { font-size: 10px; color: var(--muted); line-height: 1.6; }

/* 弹窗 */
.modal-mask {
  position: fixed; inset: 0;
  background: rgba(3, 6, 16, .78);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  display: grid;
  place-items: center;
  z-index: 50;
  padding: 20px;
  animation: fadeIn .18s;
}
@keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
.modal {
  background: #0d1530;
  border: 1px solid rgba(90,160,240,.28);
  border-radius: 18px;
  padding: 22px;
  width: 100%;
  max-width: 400px;
  max-height: 86vh;
  overflow-y: auto;
  box-shadow: 0 24px 70px rgba(0,0,0,.6);
  animation: pop .22s cubic-bezier(.2,1.2,.4,1);
}
@keyframes pop { from { transform: scale(.94); opacity: 0 } to { transform: scale(1); opacity: 1 } }
.modal h3 { font-size: 16px; margin-bottom: 4px; }
.modal .hint { font-size: 11.5px; color: var(--muted); margin-bottom: 16px; line-height: 1.65; }
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 7px; letter-spacing: 1px; }
.field input {
  width: 100%;
  padding: 11px 13px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: rgba(255,255,255,.04);
  color: var(--text);
  font-size: 13px;
  font-family: inherit;
  outline: none;
  transition: border-color .16s;
}
.field input:focus { border-color: rgba(94,234,212,.5); }
.cat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.cat-btn {
  padding: 10px 4px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: rgba(255,255,255,.03);
  color: var(--text);
  cursor: pointer;
  font-family: inherit;
  font-size: 11px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  transition: all .16s;
}
.cat-btn span { font-size: 18px; }
.cat-btn:hover { background: rgba(255,255,255,.07); }
.cat-btn.active { border-color: var(--accent); background: rgba(94,234,212,.12); }
.modal-actions { display: flex; gap: 10px; margin-top: 18px; }
.modal-actions .btn { flex: 1; padding: 11px; text-align: center; }

/* 安装指南 */
.guide-step {
  display: flex;
  gap: 12px;
  padding: 11px 0;
  border-bottom: 1px dashed rgba(90,160,240,.14);
}
.guide-step:last-child { border-bottom: none; }
.step-num {
  width: 24px; height: 24px;
  flex-shrink: 0;
  border-radius: 50%;
  background: rgba(94,234,212,.15);
  border: 1px solid rgba(94,234,212,.45);
  color: var(--accent);
  font-size: 11px;
  font-weight: 700;
  display: grid; place-items: center;
}
.step-body .t { font-size: 12.5px; font-weight: 600; margin-bottom: 4px; }
.step-body .d { font-size: 11px; color: var(--muted); line-height: 1.65; }
.step-body code {
  background: rgba(255,255,255,.07);
  padding: 1px 6px;
  border-radius: 4px;
  font-size: 10.5px;
  color: var(--accent2);
  font-family: 'SF Mono', Menlo, monospace;
}

/* 年鉴 */
.yb-item { display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px dashed rgba(90,160,240,.12); }
.yb-item:last-child { border-bottom: none; }
.yb-icon { font-size: 17px; width: 24px; text-align: center; opacity: .9; flex-shrink: 0; }
.yb-body .t { font-size: 12px; line-height: 1.5; }

<body>
<div id="app">
  <header>
    <div class="brand">
      <span class="logo">🪐</span>
      <div>
        <h1>习惯星球文明</h1>
        <p>离线单文件版 · 数据保存在本机</p>
      </div>
    </div>
    <div class="header-right">
      <div class="header-stats" id="headerStats"></div>
      <button class="btn install-btn" id="installBtn">📲 安装APP</button>
    </div>
  </header>

  <section class="stage-area">
    <canvas id="planet"></canvas>
    <div class="tip">点击空白地块落成新习惯 · 点击建筑查看详情</div>
  </section>

  <aside id="side"></aside>
</div>

<script>
/* ============================================================
   离线存储封装（localStorage 不可用时自动降级为内存）
   ============================================================ */
const memoryStore = {};
let storageOK = (function () {
  try {
    const k = '__habit_planet_probe__';
    localStorage.setItem(k, '1');
    localStorage.removeItem(k);
    return true;
  } catch (e) {
    return false;
  }
})();

function storageSet(key, val) {
  if (storageOK) {
    try { localStorage.setItem(key, val); return; }
    catch (e) { storageOK = false; }
  }
  memoryStore[key] = val;
}

function storageGet(key) {
  if (storageOK) {
    try { return localStorage.getItem(key); }
    catch (e) { storageOK = false; }
  }
  return (key in memoryStore) ? memoryStore[key] : null;
}

/* ============================================================
   常量
   ============================================================ */
const STORAGE_KEY = 'habit-planet-civ-v2';
const GRID_LEVELS = [6, 8, 10, 12];
let gridLevel = 0;
let GRID = GRID_LEVELS[0];

const TW = 80, TH = 40;
const LOGICAL_W = 720, LOGICAL_H = 520;
let ORIGIN_X = LOGICAL_W / 2;
let ORIGIN_Y = 170;
let viewScale = 1;

const THRESHOLDS = [7, 21, 49, 100];
const STAGE_COUNTS = [3, 7, 21, 49, 100];

const CATEGORIES = {
  sport:   { name: '活力', hue: 12,  icon: '🏃', example: '晨跑营地' },
  read:    { name: '知识', hue: 210, icon: '📚', example: '阅读塔' },
  tidy:    { name: '秩序', hue: 152, icon: '🧹', example: '整理工坊' },
  morning: { name: '晨光', hue: 45,  icon: '🌅', example: '晨光哨站' },
  social:  { name: '联结', hue: 280, icon: '🤝', example: '联结广场' },
  create:  { name: '灵感', hue: 330, icon: '🎨', example: '灵感画室' },
};

const STAGE_NAMES = ['地基', '初级设施', '小镇', '城市区域', '奇观'];
const STAGE_DESC = [
  '尚未建成，每次打卡为地基注入能量',
  '累计 7 次，初具规模',
  '累计 21 次，城镇成型',
  '累计 49 次，城区扩张',
  '累计 100 次，化为文明奇观',
];

const CATEGORY_STAGE_NAMES = {
  sport:   ['晨跑地基', '晨跑营地', '活力小镇', '运动城区', '晨跑太阳塔'],
  read:    ['阅读地基', '阅读塔', '知识小镇', '学城区', '知识大图书馆'],
  tidy:    ['整理地基', '整理工坊', '秩序小镇', '秩序城区', '秩序方尖碑'],
  morning: ['晨光地基', '晨光哨站', '晨光小镇', '黎明城区', '晨光圣殿'],
  social:  ['联结地基', '联结广场', '联结小镇', '共生城区', '联结穹顶'],
  create:  ['灵感地基', '灵感画室', '灵感小镇', '创作城区', '灵感天穹'],
};

const MILESTONES = [
  { at: 7,   name: '建成初级设施' },
  { at: 21,  name: '升级为小镇' },
  { at: 49,  name: '升级为城市区域' },
  { at: 100, name: '成为文明奇观' },
];

const STAGE_SCORE = [0, 10, 30, 80, 200];
const LINK_BONUS = 15;
const DIVERSITY_BONUS = 25;

const CIV_TIERS = [
  { min: 0,    name: '荒原聚落',     icon: '🌑', desc: '星球上只有零星的地基，文明尚未萌芽。' },
  { min: 60,   name: '萌芽村落',     icon: '🏕️', desc: '第一座初级设施建成，文明的火种开始燃烧。' },
  { min: 180,  name: '小型城镇',     icon: '🏘️', desc: '道路连接起建筑，居民开始在星球上生活。' },
  { min: 400,  name: '繁荣城市',     icon: '🏙️', desc: '多个属性协同发展，城区开始扩张。' },
  { min: 900,  name: '文明都市',     icon: '🌆', desc: '城市区域连成一片，文明进入高速发展期。' },
  { min: 1800, name: '星海文明',     icon: '🛸', desc: '奇观拔地而起，星球的能量场开始共振。' },
  { min: 3200, name: '传奇奇观文明', icon: '✨', desc: '所有奇观交相辉映，成为传说级文明。' },
];

/* ============================================================
   工具函数
   ============================================================ */
function getStage(count) {
  if (count >= 100) return 4;
  if (count >= 49) return 3;
  if (count >= 21) return 2;
  if (count >= 7) return 1;
  return 0;
}

function progressInfo(count) {
  const stage = getStage(count);
  if (stage >= 4) return { pct: 100, from: 100, to: 100, next: null, stage };
  const from = stage === 0 ? 0 : THRESHOLDS[stage - 1];
  const to = THRESHOLDS[stage];
  return { pct: Math.max(0, (count - from) / (to - from) * 100), from, to, next: to, stage };
}

function isoToScreen(gx, gy) {
  return {
    x: ORIGIN_X + (gx - gy) * TW / 2,
    y: ORIGIN_Y + (gx + gy) * TH / 2,
  };
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  })[c]);
}

function fmtDate(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return '';
  return `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}`;
}

function todayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
}

function updateViewTransform() {
  const N = GRID;
  const gridW = N * TW;
  const gridH = (N - 1) * TH + 160;
  const s = Math.min(1, (LOGICAL_W - 60) / gridW, (LOGICAL_H - 40) / gridH);
  viewScale = Math.max(0.4, s);
  ORIGIN_X = LOGICAL_W / 2;
  ORIGIN_Y = LOGICAL_H / 2 - (N - 1) * TH / 2 + 10;
}

/* ============================================================
   状态
   ============================================================ */
const state = {
  habits: [],
  view: 'list',
  selectedId: null,
  newCategory: 'sport',
  codexCategory: 'sport',
};

const floaters = [];
const pulses = [];
let hoverCell = null;

/* ============================================================
   持久化
   ============================================================ */
function save() {
  try {
    storageSet(STORAGE_KEY, JSON.stringify({
      habits: state.habits,
      gridLevel,
    }));
  } catch (e) { /* ignore */ }
}

function load() {
  try {
    const raw = storageGet(STORAGE_KEY);
    if (!raw) return false;
    const data = JSON.parse(raw);
    if (typeof data.gridLevel === 'number' && data.gridLevel >= 0 && data.gridLevel < GRID_LEVELS.length) {
      gridLevel = data.gridLevel;
      GRID = GRID_LEVELS[gridLevel];
    }
    if (Array.isArray(data.habits)) {
      state.habits = data.habits.map(normalizeHabit);
      return state.habits.length > 0;
    }
  } catch (e) { /* ignore */ }
  return false;
}

function normalizeHabit(h) {
  return {
    id: h.id || ('h' + Math.random().toString(36).slice(2, 9)),
    name: h.name || '未命名习惯',
    category: CATEGORIES[h.category] ? h.category : 'sport',
    count: Number(h.count) || 0,
    gx: Number.isInteger(h.gx) ? h.gx : 0,
    gy: Number.isInteger(h.gy) ? h.gy : 0,
    createdAt: h.createdAt || new Date().toISOString(),
    milestones: Array.isArray(h.milestones) ? h.milestones : [],
    log: Array.isArray(h.log) ? h.log : [],
  };
}

/* ============================================================
   地块逻辑
   ============================================================ */
function isOccupied(gx, gy) {
  return state.habits.some(h => h.gx === gx && h.gy === gy);
}

function findFreePos(habits) {
  const used = new Set(habits.map(h => `${h.gx},${h.gy}`));
  const center = (GRID - 1) / 2;
  const cells = [];
  for (let x = 0; x < GRID; x++) {
    for (let y = 0; y < GRID; y++) {
      cells.push({ x, y, d: Math.abs(x - center) + Math.abs(y - center) + Math.random() * 0.5 });
    }
  }
  cells.sort((a, b) => a.d - b.d);
  for (const c of cells) {
    if (!used.has(`${c.x},${c.y}`)) return { gx: c.x, gy: c.y };
  }
  return null;
}

function canExpand() {
  if (gridLevel >= GRID_LEVELS.length - 1) return false;
  return state.habits.length >= Math.ceil(GRID * GRID * 0.5);
}

function expandPlanet() {
  if (!canExpand()) return;
  const oldN = GRID;
  gridLevel++;
  GRID = GRID_LEVELS[gridLevel];
  const diff = (GRID - oldN) / 2;
  state.habits.forEach(h => {
    h.gx += diff;
    h.gy += diff;
  });
  updateViewTransform();
  save();
  updateHeader();
  renderPanel();
  pulses.push({
    x: LOGICAL_W / 2, y: LOGICAL_H / 2,
    t0: performance.now(), dur: 2000, hue: 180,
  });
}

/* ============================================================
   Canvas 与绘制
   ============================================================ */
const canvas = document.getElementById('planet');
let ctx = canvas.getContext('2d');

function withCtx(targetCtx, ox, oy, fn) {
  const sCtx = ctx, sx = ORIGIN_X, sy = ORIGIN_Y;
  ctx = targetCtx;
  ORIGIN_X = ox;
  ORIGIN_Y = oy;
  try { fn(); } finally {
    ctx = sCtx;
    ORIGIN_X = sx;
    ORIGIN_Y = sy;
  }
}

function initCanvas() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  canvas.width = LOGICAL_W * dpr;
  canvas.height = LOGICAL_H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
initCanvas();

/* ---- 基础几何 ---- */
function isoBox(cx, cy, hw, hd, h, hue, sat, light, alpha = 1) {
  const topY = cy - h;
  ctx.beginPath();
  ctx.moveTo(cx - hw, topY);
  ctx.lineTo(cx, topY + hd);
  ctx.lineTo(cx, cy + hd);
  ctx.lineTo(cx - hw, cy);
  ctx.closePath();
  ctx.fillStyle = `hsla(${hue},${sat}%,${light - 16}%,${alpha})`;
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(cx + hw, topY);
  ctx.lineTo(cx, topY + hd);
  ctx.lineTo(cx, cy + hd);
  ctx.lineTo(cx + hw, cy);
  ctx.closePath();
  ctx.fillStyle = `hsla(${hue},${sat}%,${light - 4}%,${alpha})`;
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(cx, topY - hd);
  ctx.lineTo(cx + hw, topY);
  ctx.lineTo(cx, topY + hd);
  ctx.lineTo(cx - hw, topY);
  ctx.closePath();
  ctx.fillStyle = `hsla(${hue},${sat}%,${light + 12}%,${alpha})`;
  ctx.fill();
}

function isoRoof(cx, cy, hw, hd, h, hue, sat, light) {
  const apexY = cy - h;
  ctx.beginPath();
  ctx.moveTo(cx - hw, cy);
  ctx.lineTo(cx, cy + hd);
  ctx.lineTo(cx, apexY);
  ctx.closePath();
  ctx.fillStyle = `hsl(${hue},${sat}%,${light - 14}%)`;
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(cx + hw, cy);
  ctx.lineTo(cx, cy + hd);
  ctx.lineTo(cx, apexY);
  ctx.closePath();
  ctx.fillStyle = `hsl(${hue},${sat}%,${light}%)`;
  ctx.fill();
}

function windowDots(cx, cy, hw, hd, h, t) {
  const S = { x: cx, y: cy + hd };
  const E = { x: cx + hw, y: cy };
  const W = { x: cx - hw, y: cy };
  const faces = [
    { a: S, b: E, alpha: 0.95 },
    { a: W, b: S, alpha: 0.6 },
  ];
  faces.forEach((f, fi) => {
    for (let i = 1; i <= 2; i++) {
      for (let j = 1; j <= 2; j++) {
        const u = i / 3, v = j / 3;
        const px = f.a.x + (f.b.x - f.a.x) * u;
        const py = f.a.y + (f.b.y - f.a.y) * u - h * v;
        const flick = 0.75 + Math.sin(t * 2.2 + i * 1.7 + j * 2.3 + fi) * 0.2;
        ctx.beginPath();
        ctx.arc(px, py, 1.9, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 232, 150, ${flick * f.alpha})`;
        ctx.fill();
      }
    }
  });
}

function glowDot(x, y, hue, t, r = 4) {
  const pulse = 1 + Math.sin(t * 3) * 0.25;
  const g = ctx.createRadialGradient(x, y, 0, x, y, r * 6 * pulse);
  g.addColorStop(0, `hsla(${hue},100%,75%,.95)`);
  g.addColorStop(0.35, `hsla(${hue},100%,65%,.35)`);
  g.addColorStop(1, `hsla(${hue},100%,60%,0)`);
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(x, y, r * 6 * pulse, 0, Math.PI * 2);
  ctx.fill();

  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fillStyle = `hsl(${hue},100%,85%)`;
  ctx.fill();
}

/* ---- 建筑绘制 ---- */
function drawBuilding(habit, t) {
  const { x, y } = isoToScreen(habit.gx, habit.gy);
  const stage = getStage(habit.count);
  const hue = CATEGORIES[habit.category].hue;

  ctx.beginPath();
  ctx.ellipse(x, y + 2, 27, 13, 0, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0,0,0,.38)';
  ctx.fill();

  if (stage === 0) {
    isoBox(x, y, 23, 11.5, 5, 215, 12, 26);
    ctx.save();
    ctx.setLineDash([5, 5]);
    ctx.beginPath();
    const ty = y - 5;
    ctx.moveTo(x, ty - 11.5);
    ctx.lineTo(x + 23, ty);
    ctx.lineTo(x, ty + 11.5);
    ctx.lineTo(x - 23, ty);
    ctx.closePath();
    ctx.strokeStyle = `hsla(${hue},75%,65%,.55)`;
    ctx.lineWidth = 1.4;
    ctx.stroke();
    ctx.restore();
    const p = habit.count / 7;
    glowDot(x, y - 8, hue, t, 2 + p * 1.4);
    return;
  }

  if (stage === 1) {
    isoBox(x, y, 22, 11, 7, hue, 52, 32);
    isoBox(x, y - 7, 15, 7.5, 17, hue, 62, 46);
    windowDots(x, y - 7, 15, 7.5, 17, t);
    glowDot(x, y - 25, hue, t, 2.6);
    return;
  }

  if (stage === 2) {
    isoBox(x, y, 24, 12, 6, hue, 48, 28);
    isoBox(x + 14, y - 3, 8.5, 4.2, 10, hue, 52, 36);
    isoBox(x, y - 6, 17, 8.5, 12, hue, 60, 44);
    isoRoof(x, y - 18, 17, 8.5, 10, hue, 68, 54);
    windowDots(x, y - 6, 17, 8.5, 12, t);
    glowDot(x + 14, y - 14, hue, t + 1.3, 2);
    return;
  }

  if (stage === 3) {
    isoBox(x, y, 25, 12.5, 6, hue, 46, 26);
    isoBox(x - 15, y - 3, 8, 4, 11, hue, 50, 34);
    isoBox(x, y - 6, 20, 10, 12, hue, 58, 42);
    isoBox(x, y - 18, 14, 7, 11, hue, 62, 48);
    isoBox(x, y - 29, 9, 4.5, 9, hue, 66, 52);
    isoRoof(x, y - 38, 9, 4.5, 10, hue, 72, 58);
    windowDots(x, y - 6, 20, 10, 12, t);
    windowDots(x, y - 18, 14, 7, 11, t + 0.8);
    glowDot(x, y - 50, hue, t, 2.4);
    return;
  }

  const beamTop = y - 118;
  const g = ctx.createLinearGradient(x, y - 40, x, beamTop);
  g.addColorStop(0, `hsla(${hue},100%,70%,.30)`);
  g.addColorStop(1, `hsla(${hue},100%,70%,0)`);
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(x - 9, y - 40);
  ctx.lineTo(x + 9, y - 40);
  ctx.lineTo(x + 24, beamTop);
  ctx.lineTo(x - 24, beamTop);
  ctx.closePath();
  ctx.fill();

  isoBox(x, y, 26, 13, 7, hue, 44, 24);
  isoBox(x + 16, y - 3, 9, 4.5, 12, hue, 48, 32);
  isoBox(x - 16, y - 3, 9, 4.5, 10, hue, 48, 30);
  isoBox(x, y - 7, 21, 10.5, 13, hue, 58, 42);
  isoBox(x, y - 20, 15, 7.5, 12, hue, 62, 48);
  isoBox(x, y - 32, 10, 5, 10, hue, 66, 53);
  isoRoof(x, y - 42, 10, 5, 12, hue, 74, 60);
  windowDots(x, y - 7, 21, 10.5, 13, t);
  windowDots(x, y - 20, 15, 7.5, 12, t + 1.1);

  const ringR = 15 + Math.sin(t * 2) * 2.5;
  ctx.save();
  ctx.translate(x, y - 46);
  ctx.scale(1, 0.42);
  ctx.beginPath();
  ctx.arc(0, 0, ringR, 0, Math.PI * 2);
  ctx.strokeStyle = `hsla(${hue},100%,75%,${0.5 + Math.sin(t * 2) * 0.2})`;
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.restore();

  glowDot(x, y - 60, hue, t, 4);
}

const BUILD_TOP = [16, 30, 36, 54, 74];

/* ---- 场景 ---- */
const stars = [];
(function initStars() {
  for (let i = 0; i < 110; i++) {
    stars.push({
      x: Math.random() * LOGICAL_W,
      y: Math.random() * LOGICAL_H,
      r: Math.random() * 1.3 + 0.25,
      ph: Math.random() * Math.PI * 2,
      sp: 0.6 + Math.random() * 1.8,
    });
  }
})();

function drawStars(t) {
  for (const s of stars) {
    const a = 0.25 + Math.abs(Math.sin(t * s.sp * 0.5 + s.ph)) * 0.6;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(190, 225, 255, ${a})`;
    ctx.fill();
  }
}

function drawGrid() {
  for (let gx = 0; gx < GRID; gx++) {
    for (let gy = 0; gy < GRID; gy++) {
      const { x, y } = isoToScreen(gx, gy);
      ctx.beginPath();
      ctx.moveTo(x, y - TH / 2);
      ctx.lineTo(x + TW / 2, y);
      ctx.lineTo(x, y + TH / 2);
      ctx.lineTo(x - TW / 2, y);
      ctx.closePath();
      ctx.fillStyle = (gx + gy) % 2
        ? 'rgba(28, 48, 88, .52)'
        : 'rgba(22, 38, 72, .52)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(90, 160, 240, .10)';
      ctx.lineWidth = 1;
      ctx.stroke();
    }
  }
}

function drawHoverCell(t) {
  if (!hoverCell) return;
  const { x, y } = isoToScreen(hoverCell.gx, hoverCell.gy);
  ctx.beginPath();
  ctx.moveTo(x, y - TH / 2);
  ctx.lineTo(x + TW / 2, y);
  ctx.lineTo(x, y + TH / 2);
  ctx.lineTo(x - TW / 2, y);
  ctx.closePath();
  ctx.fillStyle = `rgba(94,234,212,${0.10 + Math.sin(t * 4) * 0.04})`;
  ctx.fill();
  ctx.strokeStyle = 'rgba(94,234,212,.6)';
  ctx.lineWidth = 1.6;
  ctx.stroke();

  ctx.save();
  ctx.strokeStyle = 'rgba(94,234,212,.75)';
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x - 7, y);
  ctx.lineTo(x + 7, y);
  ctx.moveTo(x, y - 7);
  ctx.lineTo(x, y + 7);
  ctx.stroke();
  ctx.restore();
}

function drawRoads() {
  const map = new Map();
  state.habits.forEach(h => map.set(`${h.gx},${h.gy}`, h));

  ctx.lineCap = 'round';
  state.habits.forEach(h => {
    if (getStage(h.count) < 1) return;
    const a = isoToScreen(h.gx, h.gy);
    [[1, 0], [0, 1]].forEach(([dx, dy]) => {
      const o = map.get(`${h.gx + dx},${h.gy + dy}`);
      if (!o || getStage(o.count) < 1) return;
      const b = isoToScreen(o.gx, o.gy);
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.strokeStyle = 'rgba(120, 200, 255, .16)';
      ctx.lineWidth = 9;
      ctx.stroke();
      ctx.strokeStyle = 'rgba(160, 230, 255, .28)';
      ctx.lineWidth = 2;
      ctx.stroke();
    });
  });
}

function drawFloaters() {
  const now = performance.now();
  for (let i = floaters.length - 1; i >= 0; i--) {
    const f = floaters[i];
    const p = (now - f.t0) / f.dur;
    if (p >= 1) { floaters.splice(i, 1); continue; }
    ctx.save();
    ctx.globalAlpha = 1 - p * p;
    ctx.font = 'bold 20px -apple-system, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = f.color;
    ctx.shadowColor = f.color;
    ctx.shadowBlur = 14;
    ctx.fillText(f.text, f.x, f.y - p * 46);
    ctx.restore();
  }
}

function drawPulses() {
  const now = performance.now();
  for (let i = pulses.length - 1; i >= 0; i--) {
    const p = pulses[i];
    const k = (now - p.t0) / p.dur;
    if (k >= 1) { pulses.splice(i, 1); continue; }
    const r = 12 + k * 90;
    ctx.beginPath();
    ctx.ellipse(p.x, p.y, r, r * 0.45, 0, 0, Math.PI * 2);
    ctx.strokeStyle = `hsla(${p.hue},100%,72%,${(1 - k) * 0.8})`;
    ctx.lineWidth = 3 * (1 - k) + 0.5;
    ctx.stroke();
  }
}

function render(t) {
  ctx.clearRect(0, 0, LOGICAL_W, LOGICAL_H);

  const g = ctx.createRadialGradient(LOGICAL_W / 2, LOGICAL_H / 2 + 60, 30, LOGICAL_W / 2, LOGICAL_H / 2 + 60, 380);
  g.addColorStop(0, 'rgba(45, 100, 190, .26)');
  g.addColorStop(1, 'rgba(45, 100, 190, 0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);

  drawStars(t);

  ctx.save();
  ctx.translate(LOGICAL_W / 2, LOGICAL_H / 2);
  ctx.scale(viewScale, viewScale);
  ctx.translate(-LOGICAL_W / 2, -LOGICAL_H / 2);

  drawGrid();
  drawRoads();
  drawHoverCell(t);

  const items = state.habits.slice().sort((a, b) => (a.gx + a.gy) - (b.gx + b.gy));
  items.forEach(h => drawBuilding(h, t));

  drawPulses();
  drawFloaters();

  ctx.restore();
}

function loop(now) {
  render(now / 1000);
  requestAnimationFrame(loop);
}

/* ============================================================
   拾取
   ============================================================ */
function eventToLogical(e) {
  const rect = canvas.getBoundingClientRect();
  const rawX = (e.clientX - rect.left) / rect.width * LOGICAL_W;
  const rawY = (e.clientY - rect.top) / rect.height * LOGICAL_H;
  const cx = LOGICAL_W / 2, cy = LOGICAL_H / 2;
  return {
    x: (rawX - cx) / viewScale + cx,
    y: (rawY - cy) / viewScale + cy,
  };
}

function pickCell(x, y) {
  const dx = x - ORIGIN_X;
  const dy = y - ORIGIN_Y;
  const gx = Math.round(dx / TW + dy / TH);
  const gy = Math.round(dy / TH - dx / TW);
  if (gx < 0 || gx >= GRID || gy < 0 || gy >= GRID) return null;
  return { gx, gy };
}

function pickTarget(x, y) {
  const items = state.habits.slice().sort((a, b) => (b.gx + b.gy) - (a.gx + a.gy));
  for (const h of items) {
    const p = isoToScreen(h.gx, h.gy);
    const stage = getStage(h.count);
    const top = p.y - BUILD_TOP[stage];
    if (x > p.x - 30 && x < p.x + 30 && y > top - 12 && y < p.y + 15) {
      return { type: 'habit', habit: h };
    }
  }
  const cell = pickCell(x, y);
  if (cell && !isOccupied(cell.gx, cell.gy)) {
    return { type: 'cell', gx: cell.gx, gy: cell.gy };
  }
  return null;
}

canvas.addEventListener('mousemove', (e) => {
  if (e.pointerType === 'touch') return;
  const p = eventToLogical(e);
  const t = pickTarget(p.x, p.y);
  hoverCell = (t && t.type === 'cell') ? { gx: t.gx, gy: t.gy } : null;
});

canvas.addEventListener('mouseleave', () => { hoverCell = null; });

let touchStart = null;
canvas.addEventListener('touchstart', (e) => {
  if (e.touches.length === 1) {
    const t = e.touches[0];
    touchStart = { x: t.clientX, y: t.clientY };
  }
}, { passive: true });

canvas.addEventListener('touchend', (e) => {
  if (!touchStart) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - touchStart.x;
  const dy = t.clientY - touchStart.y;
  touchStart = null;
  if (Math.hypot(dx, dy) > 12) return;
  handleTap(t.clientX, t.clientY);
}, { passive: true });

canvas.addEventListener('click', (e) => {
  if (e.pointerType === 'touch') return;
  handleTap(e.clientX, e.clientY);
});

function handleTap(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  const rawX = (clientX - rect.left) / rect.width * LOGICAL_W;
  const rawY = (clientY - rect.top) / rect.height * LOGICAL_H;
  const cx = LOGICAL_W / 2, cy = LOGICAL_H / 2;
  const x = (rawX - cx) / viewScale + cx;
  const y = (rawY - cy) / viewScale + cy;

  const t = pickTarget(x, y);
  if (!t) {
    if (state.view === 'detail') {
      state.view = 'list';
      state.selectedId = null;
      renderPanel();
    }
    return;
  }
  if (t.type === 'habit') {
    state.view = 'detail';
    state.selectedId = t.habit.id;
    renderPanel();
  } else {
    openCreateModal({ gx: t.gx, gy: t.gy });
  }
}

/* ============================================================
   业务动作
   ============================================================ */
function createHabit(name, category, pos) {
  let target = pos || null;
  if (target && isOccupied(target.gx, target.gy)) target = null;
  if (!target) target = findFreePos(state.habits);
  if (!target) {
    alert('星球地块已满啦。可以先拆除一些旧建筑，或扩张星球来增加地块。');
    return null;
  }
  const habit = normalizeHabit({
    id: 'h' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    name: (name || '').trim() || CATEGORIES[category].example,
    category,
    count: 0,
    gx: target.gx,
    gy: target.gy,
    createdAt: new Date().toISOString(),
    milestones: [],
    log: [],
  });
  state.habits.push(habit);
  save();
  const p = isoToScreen(habit.gx, habit.gy);
  pulses.push({ x: p.x, y: p.y - 10, t0: performance.now(), dur: 1200, hue: CATEGORIES[category].hue });
  return habit;
}

function doCheckIn(habit) {
  const today = todayKey();
  const todayCount = (habit.log || []).filter(s => {
    const d = new Date(s);
    return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}` === today;
  }).length;

  if (todayCount >= 1) {
    const ok = confirm(`「${habit.name}」今天已经打卡 ${todayCount} 次了。\n\n仍要补记一次吗？（补记会计入累计，但不鼓励频繁补记）`);
    if (!ok) return;
  }

  habit.log = habit.log || [];
  habit.log.push(new Date().toISOString());
  habit.count += 1;

  const ms = MILESTONES.find(m => m.at === habit.count);
  if (ms) {
    habit.milestones = habit.milestones || [];
    habit.milestones.push({
      count: habit.count,
      name: ms.name,
      date: new Date().toISOString(),
    });
    const p = isoToScreen(habit.gx, habit.gy);
    pulses.push({ x: p.x, y: p.y - 10, t0: performance.now(), dur: 1800, hue: CATEGORIES[habit.category].hue });
  }

  const p = isoToScreen(habit.gx, habit.gy);
  floaters.push({
    x: p.x + (Math.random() - 0.5) * 14,
    y: p.y - 46,
    text: '+1',
    color: `hsl(${CATEGORIES[habit.category].hue}, 95%, 72%)`,
    t0: performance.now(),
    dur: 1400,
  });

  save();
  updateHeader();
  renderPanel();
}

function deleteHabit(habit) {
  if (!confirm(`确定要拆除「${habit.name}」的全部建筑吗？\n累计 ${habit.count} 次的记录也会一并删除，且无法恢复。`)) return;
  state.habits = state.habits.filter(h => h.id !== habit.id);
  state.view = 'list';
  state.selectedId = null;
  save();
  updateHeader();
  renderPanel();
}

/* ============================================================
   统计与文明度
   ============================================================ */
function countLinks() {
  let n = 0;
  const map = new Map();
  state.habits.forEach(h => map.set(`${h.gx},${h.gy}`, h));
  state.habits.forEach(h => {
    if (getStage(h.count) < 1) return;
    [[1, 0], [0, 1]].forEach(([dx, dy]) => {
      const o = map.get(`${h.gx + dx},${h.gy + dy}`);
      if (o && getStage(o.count) >= 1) n++;
    });
  });
  return n;
}

function computeCiv() {
  const byStage = [0, 0, 0, 0, 0];
  const byCat = {};
  Object.keys(CATEGORIES).forEach(k => { byCat[k] = 0; });

  let base = 0;
  state.habits.forEach(h => {
    const s = getStage(h.count);
    byStage[s]++;
    const sc = STAGE_SCORE[s];
    base += sc;
    byCat[h.category] += sc;
  });

  const links = countLinks();
  const linkBonus = links * LINK_BONUS;
  const diversity = Object.keys(byCat).filter(k => byCat[k] > 0).length;
  const diversityBonus = diversity * DIVERSITY_BONUS;
  const total = base + linkBonus + diversityBonus;

  let tierIdx = 0;
  for (let i = 0; i < CIV_TIERS.length; i++) {
    if (total >= CIV_TIERS[i].min) tierIdx = i;
  }
  const tier = CIV_TIERS[tierIdx];
  const next = CIV_TIERS[tierIdx + 1] || null;

  return {
    total, base, linkBonus, diversityBonus, links, diversity,
    byStage, byCat, tier, next, tierIdx,
  };
}

function updateHeader() {
  const totalChecks = state.habits.reduce((s, h) => s + h.count, 0);
  const built = state.habits.filter(h => getStage(h.count) >= 1).length;
  const wonders = state.habits.filter(h => getStage(h.count) >= 4).length;
  const civ = computeCiv();
  document.getElementById('headerStats').innerHTML = `
    <div class="civ">文明度 <b>${civ.total}</b></div>
    <div>打卡 <b>${totalChecks}</b></div>
    <div>建筑 <b>${built}</b></div>
    <div>奇观 <b>${wonders}</b></div>
  `;
}

function renderPreview(cv, category, stage) {
  const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  const W = 100, H = 104;
  cv.width = Math.round(W * dpr);
  cv.height = Math.round(H * dpr);
  cv.style.width = W + 'px';
  cv.style.height = H + 'px';

  const c2 = cv.getContext('2d');
  c2.setTransform(dpr, 0, 0, dpr, 0, 0);
  c2.clearRect(0, 0, W, H);

  const hue = CATEGORIES[category].hue;
  const g = c2.createRadialGradient(W / 2, 72, 4, W / 2, 72, 60);
  g.addColorStop(0, `hsla(${hue},80%,60%,.13)`);
  g.addColorStop(1, 'hsla(0,0%,0%,0)');
  c2.fillStyle = g;
  c2.fillRect(0, 0, W, H);

  const cfg = [
    { scale: 0.95, baseY: 76 },
    { scale: 0.88, baseY: 78 },
    { scale: 0.82, baseY: 82 },
    { scale: 0.74, baseY: 88 },
    { scale: 0.60, baseY: 94 },
  ][stage];

  withCtx(c2, W / 2, cfg.baseY, () => {
    c2.save();
    c2.translate(W / 2, cfg.baseY);
    c2.scale(cfg.scale, cfg.scale);
    c2.translate(-W / 2, -cfg.baseY);
    drawBuilding({ gx: 0, gy: 0, count: STAGE_COUNTS[stage], category }, 0.9);
    c2.restore();
  });
}

function renderCodexCanvases() {
  sideEl.querySelectorAll('canvas.codex-canvas').forEach(cv => {
    renderPreview(cv, cv.dataset.cat, Number(cv.dataset.stage));
  });
}

/* ---------------- 详情 ---------------- */
function detailHTML(h) {
  const cat = CATEGORIES[h.category];
  const stage = getStage(h.count);
  const pr = progressInfo(h.count);
  const today = todayKey();
  const todayCount = (h.log || []).filter(s => {
    const d = new Date(s);
    return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}` === today;
  }).length;

  const msMap = new Map((h.milestones || []).map(m => [m.count, m]));
  const timeline = MILESTONES.map(m => {
    const done = h.count >= m.at;
    const rec = msMap.get(m.at);
    return `
      <div class="tl-item">
        <div class="tl-dot ${done ? 'done' : ''}">${done ? '✓' : ''}</div>
        <div class="tl-body">
          <div class="t" style="${done ? '' : 'color:#5b6b8c'}">${m.name}</div>
          <div class="d">${done ? `${m.at} 次 · ${fmtDate(rec ? rec.date : h.createdAt)}` : `还差 ${m.at - h.count} 次`}</div>
        </div>
      </div>`;
  }).join('');

  const nextLabel = pr.next
    ? `距「${STAGE_NAMES[stage + 1]}」还需 ${pr.next - h.count} 次`
    : '已成为文明奇观';

  return `
    <button class="btn ghost" style="align-self:flex-start;padding:6px 10px" data-action="back">← 返回文明总览</button>

    <div class="detail-head">
      <div class="big-ico">${cat.icon}</div>
      <div>
        <h2>${escapeHtml(h.name)}</h2>
        <div class="tag">${cat.name}系 · ${CATEGORY_STAGE_NAMES[h.category][stage]}</div>
      </div>
    </div>

    <div class="big-count">
      <div class="n">${h.count}</div>
      <div class="lbl">累计打卡次数</div>
    </div>

    <div class="progress-wrap">
      <div class="progress-bar"><i style="width:${pr.pct}%;background:linear-gradient(90deg,hsl(${cat.hue},80%,55%),hsl(${cat.hue + 30},90%,65%))"></i></div>
      <div class="progress-meta">
        <span>${pr.from} 次</span>
        <span style="color:hsl(${cat.hue},85%,70%)">${nextLabel}</span>
        <span>${pr.to} 次</span>
      </div>
    </div>

    <div style="font-size:11px;color:var(--muted);text-align:center;margin-top:-4px">
      今日已打卡 <b style="color:var(--accent)">${todayCount}</b> 次 · 地块 (${h.gx}, ${h.gy})
    </div>

    <button class="btn primary" data-action="checkin" data-id="${h.id}">
      打卡 +1 · 为星球添砖加瓦
    </button>

    <div class="section-title">进化档案</div>
    <div class="timeline">${timeline}</div>

    <button class="btn danger" style="margin-top:6px" data-action="delete" data-id="${h.id}">拆除这座建筑</button>
  `;
}

/* ---------------- 年鉴 ---------------- */
function yearbookHTML() {
  const entries = [];
  for (const h of state.habits) {
    const cat = CATEGORIES[h.category];
    entries.push({
      date: h.createdAt,
      icon: cat.icon,
      text: `「${h.name}」在星球 (${h.gx}, ${h.gy}) 落成地基`,
    });
    for (const m of (h.milestones || [])) {
      entries.push({
        date: m.date,
        icon: '✨',
        text: `「${h.name}」${m.name}（累计 ${m.count} 次）`,
      });
    }
  }
  entries.sort((a, b) => new Date(b.date) - new Date(a.date));

  const body = entries.length
    ? entries.slice(0, 80).map(e => `
        <div class="yb-item">
          <div class="yb-icon">${e.icon}</div>
          <div class="yb-body">
            <div class="t">${escapeHtml(e.text)}</div>
            <div class="d">${fmtDate(e.date)}</div>
          </div>
        </div>`).join('')
    : `<div class="empty"><span class="big">📜</span>年鉴还是空白的<br>每一次打卡都会在这里留下痕迹</div>`;

  return `
    <div class="panel-head">
      <div>
        <div class="panel-title">文明年鉴</div>
        <div class="panel-sub">记录这颗星球上发生过的每一次进化</div>
      </div>
    </div>
    <div>${body}</div>
  `;
}

/* ============================================================
   事件委托
   ============================================================ */
sideEl.addEventListener('click', (e) => {
  const target = e.target.closest('[data-action]');
  if (!target) return;
  const action = target.dataset.action;
  const id = target.dataset.id;

  if (action === 'tab') {
    state.view = target.dataset.tab;
    state.selectedId = null;
    renderPanel();
  } else if (action === 'select') {
    state.view = 'detail';
    state.selectedId = id;
    renderPanel();
  } else if (action === 'back') {
    state.view = 'list';
    state.selectedId = null;
    renderPanel();
  } else if (action === 'codexCat') {
    state.codexCategory = target.dataset.cat;
    renderPanel();
  } else if (action === 'new') {
    openCreateModal(null);
  } else if (action === 'checkin') {
    const h = state.habits.find(x => x.id === id);
    if (h) doCheckIn(h);
  } else if (action === 'delete') {
    const h = state.habits.find(x => x.id === id);
    if (h) deleteHabit(h);
  } else if (action === 'expand') {
    expandPlanet();
  }
});

/* ============================================================
   新建弹窗
   ============================================================ */
function openCreateModal(pos) {
  const mask = document.createElement('div');
  mask.className = 'modal-mask';

  const catBtns = Object.entries(CATEGORIES).map(([key, c]) => `
    <button class="cat-btn ${key === state.newCategory ? 'active' : ''}" data-cat="${key}">
      <span>${c.icon}</span>${c.name}
    </button>`).join('');

  const posHint = pos
    ? `将在地块 (${pos.gx}, ${pos.gy}) 上落成地基`
    : '将自动选择星球中心的空地落下地基';

  mask.innerHTML = `
    <div class="modal">
      <h3>开拓新地块</h3>
      <div class="hint">${posHint}<br>每坚持 7 次，这块地基就会建成初级设施</div>

      <div class="field">
        <label>习惯名称</label>
        <input id="habitName" maxlength="20" placeholder="例如：晨跑 20 分钟" autocomplete="off">
      </div>

      <div class="field">
        <label>选择属性</label>
        <div class="cat-grid" id="catGrid">${catBtns}</div>
      </div>

      <div class="modal-actions">
        <button class="btn ghost" data-close>取消</button>
        <button class="btn primary" style="width:auto;flex:1" data-confirm>落成地基</button>
      </div>
    </div>
  `;

  document.body.appendChild(mask);

  const input = mask.querySelector('#habitName');
  setTimeout(() => input.focus(), 60);

  let selectedCat = state.newCategory;
  input.placeholder = '例如：' + CATEGORIES[selectedCat].example;

  mask.querySelector('#catGrid').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-cat]');
    if (!btn) return;
    selectedCat = btn.dataset.cat;
    state.newCategory = selectedCat;
    mask.querySelectorAll('.cat-btn').forEach(b => b.classList.toggle('active', b.dataset.cat === selectedCat));
    input.placeholder = '例如：' + CATEGORIES[selectedCat].example;
  });

  const close = () => mask.remove();

  mask.addEventListener('click', (e) => {
    if (e.target === mask || e.target.closest('[data-close]')) close();
  });

  const confirmCreate = () => {
    const name = input.value.trim() || CATEGORIES[selectedCat].example;
    const h = createHabit(name, selectedCat, pos);
    if (h) {
      state.view = 'detail';
      state.selectedId = h.id;
      updateHeader();
      renderPanel();
      close();
    }
  };

  mask.querySelector('[data-confirm]').addEventListener('click', confirmCreate);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') confirmCreate();
    if (e.key === 'Escape') close();
  });
}

/* ============================================================
   PWA 安装（仅在 http/https 下注入 manifest）
   ============================================================ */
(function setupPWA() {
  const iconSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
    <defs>
      <radialGradient id="g" cx="42%" cy="38%" r="62%">
        <stop offset="0%" stop-color="#5eead4"/>
        <stop offset="55%" stop-color="#38bdf8"/>
        <stop offset="100%" stop-color="#0f172a"/>
      </radialGradient>
    </defs>
    <rect width="512" height="512" rx="108" fill="#060a18"/>
    <circle cx="256" cy="248" r="150" fill="url(#g)"/>
    <ellipse cx="256" cy="248" rx="218" ry="64" fill="none" stroke="#5eead4" stroke-width="10" opacity="0.55" transform="rotate(-22 256 248)"/>
    <circle cx="178" cy="196" r="16" fill="#a7f3d0" opacity="0.85"/>
    <circle cx="322" cy="300" r="11" fill="#7dd3fc" opacity="0.75"/>
    <circle cx="300" cy="160" r="8" fill="#5eead4" opacity="0.7"/>
  </svg>`;

  let iconUrl = iconSvg;
  try {
    iconUrl = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(iconSvg)));
  } catch (e) { /* ignore */ }

  const isHttp = location.protocol === 'http:' || location.protocol === 'https:';

  if (isHttp) {
    try {
      const manifest = {
        name: '习惯星球文明',
        short_name: '星球文明',
        description: '用打卡养成你的习惯星球文明',
        start_url: '.',
        scope: '.',
        display: 'standalone',
        orientation: 'portrait',
        background_color: '#060a18',
        theme_color: '#060a18',
        lang: 'zh-CN',
        icons: [
          { src: iconUrl, sizes: '192x192', type: 'image/svg+xml', purpose: 'any' },
          { src: iconUrl, sizes: '512x512', type: 'image/svg+xml', purpose: 'any' },
        ],
      };
      const blob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('link');
      link.rel = 'manifest';
      link.href = url;
      document.head.appendChild(link);

      const appleIcon = document.createElement('link');
      appleIcon.rel = 'apple-touch-icon';
      appleIcon.href = iconUrl;
      document.head.appendChild(appleIcon);
    } catch (e) { /* ignore */ }
  }

  const installBtn = document.getElementById('installBtn');
  let deferredPrompt = null;

  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
  });

  installBtn.addEventListener('click', async () => {
    if (deferredPrompt) {
      deferredPrompt.prompt();
      try {
        const result = await deferredPrompt.userChoice;
        if (result.outcome === 'accepted') {
          deferredPrompt = null;
          installBtn.textContent = '✅ 已安装';
          setTimeout(() => { installBtn.textContent = '📲 安装APP'; }, 3000);
        }
      } catch (e) { /* ignore */ }
      return;
    }
    showInstallGuide();
  });
})();

/* ============================================================
   示例数据
   ============================================================ */
function seedDemo() {
  const demo = [
    { name: '晨跑 20 分钟', category: 'sport', count: 12, gx: 2, gy: 2 },
    { name: '阅读 20 页',   category: 'read',  count: 34, gx: 3, gy: 2 },
    { name: '睡前整理桌面', category: 'tidy',  count: 55, gx: 2, gy: 3 },
  ];
  demo.forEach((d, i) => {
    if (isOccupied(d.gx, d.gy)) return;
    const habit = normalizeHabit({
      id: 'demo' + i,
      name: d.name,
      category: d.category,
      count: d.count,
      gx: d.gx,
      gy: d.gy,
      createdAt: new Date(Date.now() - (d.count + 10) * 86400000).toISOString(),
      milestones: MILESTONES.filter(m => d.count >= m.at).map(m => ({
        count: m.at,
        name: m.name,
        date: new Date(Date.now() - (d.count - m.at) * 86400000).toISOString(),
      })),
      log: [],
    });
    state.habits.push(habit);
  });
  save();
}

/* ============================================================
   启动
   ============================================================ */
(function boot() {
  const hasData = load();
  if (!hasData) seedDemo();
  updateViewTransform();
  updateHeader();
  renderPanel();

  if (!storageOK) {
    const warn = document.createElement('div');
    warn.className = 'storage-warn show';
    warn.textContent = '当前环境不支持本地存储，数据仅保存在内存中，刷新后会重置。部署到 HTTPS 后可正常保存。';
    sideEl.insertBefore(warn, sideEl.firstChild);
  }

  requestAnimationFrame(loop);
})();
</script>
